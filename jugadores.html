<html lang="es">
<head>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F7F7;--fg:#111;--cel:#1A7CC2;
  --bg2:#fff;--bg3:#EFEFEF;--bg4:#E2E2E2;
  --bord:#DCDCDC;
  --gold:#C8960C;--silver:#777;--bronze:#8B4513;
  --win:#2E7D32;
  --cp:#1A7CC2;--ci:#C47000;--ca:#3A8A2A;
  --fbc:"Barlow Condensed",sans-serif;
  --fb:"Barlow",sans-serif;
}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);max-width:480px;margin:0 auto;min-height:100vh}
.hdr{background:#fff;border-bottom:3px solid var(--cel);padding:9px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:60;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.hdr img{height:38px;width:38px;object-fit:contain;flex-shrink:0}
.hdr-info{flex:1;min-width:0}
.hdr-info h1{font-family:var(--fbc);font-weight:900;font-size:18px;line-height:1.05;color:var(--fg);text-transform:uppercase}
.hdr-info p{font-size:12px;color:var(--cel);font-family:var(--fbc);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.nav-btn{margin-left:auto;flex-shrink:0;background:var(--cel);color:#fff;font-family:var(--fbc);font-weight:700;font-size:11px;border:none;border-radius:16px;padding:7px 12px;cursor:pointer;text-decoration:none;letter-spacing:.3px;white-space:nowrap}

.flt{background:#fff;border-bottom:2px solid var(--bord);padding:6px 10px;display:flex;flex-direction:column;gap:5px;position:sticky;top:60px;z-index:59;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.flt-lbl{font-family:var(--fbc);font-size:9px;color:#aaa;font-weight:700;letter-spacing:.8px;margin-bottom:2px}
.flt-row{display:flex;gap:4px}
.ftab{flex:1;padding:5px 2px;text-align:center;font-family:var(--fbc);font-weight:700;font-size:11px;cursor:pointer;border-radius:4px;color:#aaa;background:var(--bg3);border:1px solid var(--bord);transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.ftab.ap{color:#fff;background:var(--cp);border-color:var(--cp)}
.ftab.ai{color:#fff;background:var(--ci);border-color:var(--ci)}
.ftab.aa{color:#fff;background:var(--ca);border-color:var(--ca)}
.ftab.at{color:#fff;background:#7B4FC0;border-color:#7B4FC0}
.ftab.dim{opacity:.35;pointer-events:none}
.ptab{padding:4px 10px;text-align:center;font-family:var(--fbc);font-weight:700;font-size:11px;cursor:pointer;border-radius:4px;color:#aaa;background:var(--bg3);border:1px solid var(--bord);transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.ptab.active{color:var(--fg);background:var(--bg4);border-color:#999;font-weight:900}

.player-sel-wrap{padding:0;display:flex;flex-direction:column;gap:4px}
.player-combo{position:relative;width:100%}
.player-combo input{font-family:var(--fbc);font-size:14px;font-weight:700;color:var(--fg);background:var(--bg2);border:1px solid var(--bord);border-radius:6px;padding:7px 28px 7px 10px;outline:none;width:100%}
.player-combo input:focus{border-color:var(--cel)}
.combo-caret{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:#999;font-size:12px;cursor:pointer;user-select:none;pointer-events:auto}
.player-menu{display:none;position:absolute;top:calc(100% + 3px);left:0;right:0;background:#fff;border:1px solid var(--bord);border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:9999;max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.player-menu.open{display:block}
.player-menu div{padding:8px 11px;font-family:var(--fbc);font-size:13px;font-weight:600;color:var(--fg);cursor:pointer;border-bottom:1px solid #F0F0F0}
.player-menu div:last-child{border-bottom:none}
.player-menu div:hover,.player-menu div.hl{background:var(--bg3)}
.player-menu div.sel{color:var(--cel);font-weight:800}
.player-menu .empty{color:#bbb;font-weight:600;cursor:default}

.sec{padding:11px 10px 4px}
.sec-ttl{font-family:var(--fbc);font-size:11px;font-weight:700;color:#bbb;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.sec-ttl::after{content:'';flex:1;height:1px;background:var(--bord)}
.kpi{background:#fff;border:1px solid var(--bord);border-radius:7px;padding:7px 8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kpi-lbl{font-family:var(--fbc);font-size:8px;color:#bbb;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.kpi-v{font-family:var(--fbc);font-size:19px;font-weight:900;line-height:1.1;color:var(--fg)}
.kpi-u{font-size:10px;color:#bbb;font-weight:400}

.podium{display:flex;flex-direction:column;gap:5px}
.pod{background:#fff;border:1px solid var(--bord);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.pod.gold{border-color:var(--gold);border-width:2px}.pod.silver{border-color:var(--silver);border-width:2px}.pod.bronze{border-color:var(--bronze);border-width:2px}
.pod-medal{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.pod-info{flex:1;min-width:0}
.pod-name{font-family:var(--fbc);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.pod-sub{font-size:10px;color:#bbb}
.pod-nums{text-align:right;flex-shrink:0}
.pod-vel{font-family:var(--fbc);font-size:22px;font-weight:900;line-height:1;color:var(--fg)}
.pod-pct{font-size:10px;color:#aaa}
.pod-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--bg4)}
.pod-fill{height:3px}
.pod.gold .pod-fill{background:var(--gold)}.pod.silver .pod-fill{background:var(--silver)}.pod.bronze .pod-fill{background:var(--bronze)}

.cso{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;cursor:grab}
.cso:active{cursor:grabbing}
.cso svg{display:block}

.chart-toggle{display:flex;gap:4px;margin-bottom:8px}
.ctab{padding:4px 10px;font-family:var(--fbc);font-weight:700;font-size:11px;cursor:pointer;border-radius:4px;color:#aaa;background:var(--bg3);border:1px solid var(--bord);transition:all .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.ctab.active{color:#fff;background:var(--cp);border-color:var(--cp)}

.player-meta{display:flex;align-items:center;gap:8px;padding:2px 10px 8px;flex-wrap:wrap}
.pm-chip{font-family:var(--fbc);font-size:10px;font-weight:700;color:#666;background:var(--bg3);border:1px solid var(--bord);border-radius:12px;padding:3px 9px}
.pm-chip b{color:var(--fg)}

.footer{text-align:center;padding:16px 10px;font-family:var(--fbc);font-size:10px;color:#ccc;border-top:1px solid var(--bord);margin-top:8px}
::-webkit-scrollbar{height:3px;width:3px}
::-webkit-scrollbar-track{background:var(--bg3)}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px}

#loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:14px;padding:20px;text-align:center}
#loading-overlay .lo-txt{font-family:var(--fbc);font-size:15px;color:var(--cel);font-weight:700}
#loading-overlay .lo-sub{font-family:var(--fbc);font-size:12px;color:#aaa}
#loading-overlay .lo-spin{width:36px;height:36px;border:3px solid var(--bord);border-top-color:var(--cel);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── TARJETA FIFA (resumen anual) ─── */
.summary-toggle{display:flex;gap:4px;margin-bottom:10px;justify-content:center}
.fifa-wrap{display:flex;justify-content:center;padding:2px 0 10px}
.fifa-card{
  width:210px;position:relative;padding:11px 13px 62px 13px;font-family:var(--fbc);
  box-shadow:0 8px 32px rgba(0,0,0,0.45);flex-shrink:0;
  background:
    repeating-conic-gradient(from 0deg at 50% 110%, rgba(255,255,255,0.07) 0deg, transparent 2deg, transparent 5deg, rgba(255,255,255,0.04) 6deg, transparent 8deg),
    linear-gradient(160deg, #f7e87a 0%, #d4a017 15%, #f0cc50 30%, #c8900a 45%, #f5d848 55%, #b8780a 70%, #e8c040 82%, #a06010 92%, #c8a030 100%);
  clip-path:path('M 16 0 Q 0 0 0 16 L 0 388 Q 0 406 15 406 Q 84 406 105 432 Q 126 406 195 406 Q 210 406 210 388 L 210 16 Q 210 0 194 0 Z');
}
.fc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.fc-top > *{flex:1;display:flex}
.fc-pj{flex-direction:column;align-items:flex-start;text-align:left}
.fc-logo-cell,.fc-top > img{justify-content:center}
.fc-pos-wrap{justify-content:flex-end}
.fc-pos{font-family:var(--fbc);font-size:10px;font-weight:700;color:rgba(60,30,0,.62);text-transform:uppercase;line-height:1.2;max-width:68px;text-align:right}
.fc-logo{height:58px;width:58px;object-fit:contain;display:block;margin:0 auto}
.fc-pj-v{font-family:var(--fbc);font-size:22px;font-weight:900;color:rgba(50,20,0,.9);line-height:1}
.fc-pj-l{font-family:var(--fbc);font-size:7.5px;font-weight:700;color:rgba(80,38,0,.62);text-transform:uppercase}
.fc-name{text-align:center;margin:7px 0;line-height:1.15;padding:6px 0;border-top:1px solid rgba(0,0,0,.14);border-bottom:1px solid rgba(0,0,0,.14)}
.fc-first{font-family:var(--fbc);font-size:11px;font-weight:600;color:rgba(60,28,0,.65);text-transform:uppercase;letter-spacing:.8px;display:block}
.fc-last{font-family:var(--fbc);font-size:17px;font-weight:900;color:rgba(50,20,0,.92);text-transform:uppercase;letter-spacing:1.3px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px 3px;margin-top:6px}
.fc-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:7px 3px;margin-top:6px;padding:0 16px}
.fc-stat{display:flex;flex-direction:column;align-items:center}
.fc-sv{font-family:var(--fbc);font-size:16px;font-weight:900;color:rgba(60,30,0,.82);white-space:nowrap;line-height:1.15}
.fc-sep{width:18px;height:1px;background:rgba(100,50,0,.2);margin:2px auto}
.fc-sl{font-family:var(--fbc);font-size:8.5px;font-weight:700;color:rgba(80,38,0,.62);letter-spacing:.3px}
.fifa-note{font-family:var(--fbc);font-size:9px;color:#bbb;text-align:center;margin-top:2px}
</style>
</head>
<body>

<div class="hdr">
  <img id="hdr-logo" alt="CASI">
  <div class="hdr-info">
    <h1>RESUMEN ANUAL GPS CASI</h1>
    <p>TOP 14 URBA 2026</p>
  </div>
  <a class="nav-btn" href="index.html">Ver por fecha ▸</a>
</div>

<div class="flt">
  <div>
    <div class="flt-lbl">EQUIPO</div>
    <div class="flt-row" id="team-tabs">
      <div class="ftab at" data-team="total" onclick="setTeam('total',this)">TOTAL</div>
      <div class="ftab" data-team="Primera" onclick="setTeam('Primera',this)">PRIMERA</div>
      <div class="ftab" data-team="Intermedia" onclick="setTeam('Intermedia',this)">INTERMEDIA</div>
      <div class="ftab" data-team="Pre A" onclick="setTeam('Pre A',this)">PRE A</div>
    </div>
  </div>
  <div>
    <div class="flt-lbl">JUGADOR</div>
    <div class="player-sel-wrap">
      <div class="player-combo" id="player-combo">
        <input id="player-input" placeholder="Escribí o elegí un jugador…" autocomplete="off"
               onfocus="openPlayerMenu()" oninput="filterPlayerMenu(this.value)" onclick="openPlayerMenu()">
        <span class="combo-caret" onclick="togglePlayerMenu(event)">▾</span>
        <div class="player-menu" id="player-menu"></div>
      </div>
    </div>
  </div>
  <div>
    <div class="flt-lbl">ORDENAR GRÁFICOS</div>
    <div class="flt-row" id="sort-tabs">
      <div class="ptab active" data-sort="fecha" onclick="setSort('fecha',this)">Por fecha</div>
      <div class="ptab" data-sort="perf" onclick="setSort('perf',this)">Por rendimiento</div>
    </div>
  </div>
</div>

<div class="player-meta" id="player-meta"></div>
<div id="mc"></div>
<div class="footer">CASI · Resumen anual GPS 2026 · PF Agustín Cony</div>

<div id="loading-overlay">
  <div class="lo-txt">Cargando temporada…</div>
  <div class="lo-spin"></div>
  <div class="lo-sub">Puede tardar unos segundos la primera vez</div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
//  CONFIG: todas las fechas de la temporada en orden cronológico
//  (F1 → F26 → Semifinal → Final). Mismo BASE_URL que el index.
// ══════════════════════════════════════════════════════════════════
const BASE_URL = 'https://raw.githubusercontent.com/agustincony/Informes-GPS/main/datos';

const FECHAS_CONFIG = [
  { key:'f1',  label:'F1',  file:'f1.json'  },
  { key:'f2',  label:'F2',  file:'f2.json'  },
  { key:'f3',  label:'F3',  file:'f3.json'  },
  { key:'f4',  label:'F4',  file:'f4.json'  },
  { key:'f5',  label:'F5',  file:'f5.json'  },
  { key:'f6',  label:'F6',  file:'f6.json'  },
  { key:'f7',  label:'F7',  file:'f7.json'  },
  { key:'f8',  label:'F8',  file:'f8.json'  },
  { key:'f9',  label:'F9',  file:'f9.json'  },
  { key:'f10', label:'F10', file:'f10.json' },
  { key:'f11', label:'F11', file:'f11.json' },
  { key:'f12', label:'F12', file:'f12.json' },
  { key:'f13', label:'F13', file:'f13.json' },
  { key:'f14', label:'F14', file:'f14.json' },
  { key:'f15', label:'F15', file:'f15.json' },
  { key:'f16', label:'F16', file:'f16.json' },
  { key:'f17', label:'F17', file:'f17.json' },
  { key:'f18', label:'F18', file:'f18.json' },
  { key:'f19', label:'F19', file:'f19.json' },
  { key:'f20', label:'F20', file:'f20.json' },
  { key:'f21', label:'F21', file:'f21.json' },
  { key:'f22', label:'F22', file:'f22.json' },
  { key:'f23', label:'F23', file:'f23.json' },
  { key:'f24', label:'F24', file:'f24.json' },
  { key:'f25', label:'F25', file:'f25.json' },
  { key:'f26', label:'F26', file:'f26.json' },
  // Playoffs — Semifinal (Primera por un lado, Inter+PreA por otro) y Final
  { key:'sf-primera', label:'Semifinal', file:'Semifinal vs Hindú PRIMERA.json' },
  { key:'sf-inter-prea', label:'Semifinal', file:'semifinales-inter y pre a.json' },
  { key:'final', label:'Final', file:'final-intermedia-vs-sic.json' },
];

// ══════════════════════════════════════════════════════════════════
//  Estado
// ══════════════════════════════════════════════════════════════════
const DATA_CACHE = {};        // key -> JSON crudo de cada fecha
let PLAYER_INDEX = {};         // nombre -> [{ key, label, rival, byTeam }]
let activeTeam = 'total';      // total | Primera | Intermedia | Pre A
let selectedPlayer = '';
let sortMode = 'fecha';        // fecha | perf
let summaryMode = 'avg';       // avg | max
let velMode = 'abs';           // abs | pct
let bigViewMode = 'stacked';

// ══════════════════════════════════════════════════════════════════
//  Nombres (mismo criterio que el index)
// ══════════════════════════════════════════════════════════════════
const DOUBLE_SURNAMES = new Set([
  'Gomez Salaverri','Montes de Oca','Rocca Rivarola','Dominguez Perdigón',
  'Rocca Sackmann','Torres Obeid','Saenz de Miera'
]);
function fmtName(full){
  const p=full.trim().split(' ');
  if(p.length===1) return p[0];
  const last3=p.slice(-3).join(' ');
  const last2=p.slice(-2).join(' ');
  let apellido, nombre;
  if(p.length>=4 && DOUBLE_SURNAMES.has(last3)){ apellido=last3; nombre=p.slice(0,-3).join(' '); }
  else if(p.length>=3 && DOUBLE_SURNAMES.has(last2)){ apellido=last2; nombre=p.slice(0,-2).join(' '); }
  else { apellido=p[p.length-1]; nombre=p.slice(0,-1).join(' '); }
  return apellido+' '+nombre[0]+'.';
}
function splitName(full){
  const p=full.trim().split(' ');
  const last3=p.slice(-3).join(' ');
  const last2=p.slice(-2).join(' ');
  let apellido, nombre;
  if(p.length>=4 && DOUBLE_SURNAMES.has(last3)){ apellido=last3; nombre=p.slice(0,-3).join(' '); }
  else if(p.length>=3 && DOUBLE_SURNAMES.has(last2)){ apellido=last2; nombre=p.slice(0,-2).join(' '); }
  else if(p.length===1){ apellido=p[0]; nombre=''; }
  else { apellido=p[p.length-1]; nombre=p.slice(0,-1).join(' '); }
  return {nombre, apellido};
}

function f(v,d=0){return (+v).toFixed(d)}
function tc(t){return t==='Primera'?'#1A7CC2':t==='Intermedia'?'#C47000':t==='Pre A'?'#3A8A2A':'#444'}
// Color para barras. En TOTAL se decide POR FECHA: si en esa fecha jugó en más
// de un equipo -> violeta; si jugó en uno solo -> color de ese equipo.
const TOTAL_COLOR = '#7B4FC0';
function barClrFor(p){
  if(activeTeam==='total'){
    if((p._nTeams||1) > 1) return TOTAL_COLOR;   // ese día jugó en 2+ equipos
    return tc(p._soloTeam||p.team);              // jugó en uno solo ese día
  }
  return tc(activeTeam);
}

// Rival a partir del titulo del JSON: "CASI vs Alumni" -> "Alumni"
function parseRival(titulo){
  if(!titulo) return '';
  const m = titulo.match(/vs\.?\s+(.+)$/i);
  if(!m) return '';
  let r = m[1].trim();
  return r;
}
// Rivales de playoffs por key+equipo (los JSON combinados no traen "vs ...").
const PLAYOFF_RIVALS = {
  'sf-primera':    { 'Primera':'Hindú' },
  'sf-inter-prea': { 'Intermedia':'Alumni', 'Pre A':'Newman' },
  'final':         { 'Intermedia':'SIC' },
};
// Rival para una fecha (key) y un equipo. Primero override de playoffs; si no, parseRival.
function rivalFor(key, team, titulo){
  const ov = PLAYOFF_RIVALS[key];
  if(ov){
    if(team && ov[team]) return ov[team];
    // en modo total, devolver todos los rivales distintos unidos ("Alumni/Newman")
    const vals = [...new Set(Object.values(ov))];
    return vals.join('/');
  }
  return parseRival(titulo);
}

// Posición: respetar overrides del proyecto
const POS_GROUP={'Pilar izquiero':'Primera Línea','Pilar izquierdo':'Primera Línea','Pilar derecho':'Primera Línea','Pilar Derecho':'Primera Línea','Hooker':'Primera Línea','Segunda Linea':'Segunda Línea','Segunda Línea':'Segunda Línea','Ala':'Tercera Línea','Octavo':'Tercera Línea','Tercera Línea':'Tercera Línea','Medio Scrum':'Medio Scrum','Apertura':'Apertura','Centro':'Centro','Wing':'Wing','Full Back':'Fullback','Fullback':'Fullback'};
function posLabel(p){return POS_GROUP[p]||p;}

// ══════════════════════════════════════════════════════════════════
//  Carga de todas las fechas + índice por jugador
// ══════════════════════════════════════════════════════════════════
async function fetchFecha(cfg){
  if(DATA_CACHE[cfg.key]) return DATA_CACHE[cfg.key];
  const r = await fetch(BASE_URL + '/' + encodeURIComponent(cfg.file));
  if(!r.ok) throw new Error('HTTP '+r.status+' '+cfg.file);
  const d = await r.json();
  DATA_CACHE[cfg.key]=d;
  return d;
}

function buildPlayerIndex(){
  PLAYER_INDEX = {};
  for(const cfg of FECHAS_CONFIG){
    const data = DATA_CACHE[cfg.key];
    if(!data || !data.players) continue;
    const perPlayer = {}; // name -> { total, Primera, Intermedia, 'Pre A' }
    ['total','Primera','Intermedia','Pre A'].forEach(team=>{
      const arr = data.players[team] || [];
      arr.forEach(rec=>{
        if(!perPlayer[rec.name]) perPlayer[rec.name]={};
        perPlayer[rec.name][team]=rec;
      });
    });
    Object.keys(perPlayer).forEach(name=>{
      if(!PLAYER_INDEX[name]) PLAYER_INDEX[name]=[];
      PLAYER_INDEX[name].push({
        key: cfg.key,
        label: cfg.label,
        titulo: data.titulo,
        byTeam: perPlayer[name]
      });
    });
  }
}

// Etiqueta de eje: "F1 Champagnat" / "Semifinal Hindú" / "Final SIC"
function axisLabel(entry, team){
  const rival = rivalFor(entry.key, team, entry.titulo);
  return rival ? (entry.label+' '+rival) : entry.label;
}

// Serie de un jugador para el equipo activo (orden cronológico)
function playerSeries(name, team){
  const entries = PLAYER_INDEX[name]||[];
  const out = [];
  entries.forEach(e=>{
    const rec = e.byTeam[team];
    if(rec){
      // El rival se resuelve con el equipo real del registro (rec.team), que en
      // modo total distingue cada semi (Alumni vs Newman, etc.).
      const rTeam = (team==='total') ? rec.team : team;
      const rival = rivalFor(e.key, rTeam, e.titulo);
      // ¿En cuántos equipos jugó EN ESTA FECHA? (claves de equipo, sin 'total')
      const teamsFecha = Object.keys(e.byTeam).filter(t=>t!=='total');
      // Equipo único de esa fecha (cuando jugó en uno solo). Tomado de la clave
      // real de byTeam, que siempre es 'Primera'/'Intermedia'/'Pre A' válida —
      // más confiable que rec.team, que a veces viene vacío en la lista total.
      const soloTeam = teamsFecha.length===1 ? teamsFecha[0] : (rec.team||'');
      out.push({ ...rec, _fecha: e.label, _rival: rival, _ejelbl: axisLabel(e, rTeam), _key: e.key, _nTeams: teamsFecha.length, _soloTeam: soloTeam });
    }
  });
  return out;
}

// Ordenar la serie de un gráfico según el modo y la métrica.
// perfKey: campo por el que ordenar cuando sortMode==='perf'.
// lowerBetter: true cuando menor es mejor (BiG) -> ascendente en perf.
function orderFor(data, perfKey, lowerBetter){
  if(sortMode==='fecha') return data; // ya cronológico
  const arr=[...data];
  arr.sort((a,b)=>{
    const va=+a[perfKey]||0, vb=+b[perfKey]||0;
    return lowerBetter ? (va-vb) : (vb-va);
  });
  return arr;
}

function playerTeams(name){
  const set = new Set();
  (PLAYER_INDEX[name]||[]).forEach(e=>{
    Object.keys(e.byTeam).forEach(t=>{ if(t!=='total') set.add(t); });
  });
  return set;
}

// ══════════════════════════════════════════════════════════════════
//  GRÁFICOS — eje X = fecha+rival (texto rotado, como el index)
// ══════════════════════════════════════════════════════════════════
function avg(arr,k){return arr.length?arr.reduce((s,p)=>s+(+p[k]||0),0)/arr.length:0}

// nameAngle: grados de rotación de la etiqueta (negativo = inclina a la izq)
function svgBars({data, barKey, barLabel, barColor, dotsKey, dotsLabel,
                  dotsFormat, barFormat, nameAngle=-45, yMin=0}){
  const n=data.length;
  if(!n) return '<p style="color:#ccc;font-family:var(--fbc);text-align:center;padding:14px">Sin datos</p>';
  const slotW=34;
  const nameH=58; // espacio para etiqueta rotada "F1 Champagnat"
  const pad={t:22,r:8,b:6,l:38};
  const chartH=148;
  const H=pad.t+chartH+nameH+pad.b;
  const W=Math.max(n*slotW+pad.l+pad.r,460);
  const BW=slotW*0.5;
  const yBase=pad.t+chartH;
  const maxBarRaw=Math.max(...data.map(p=>+p[barKey]),0.01);
  // Si yMin>0, el eje arranca en yMin (no en 0). Útil p/ velocidad.
  const base0 = (yMin && yMin < maxBarRaw) ? yMin : 0;
  const span = (maxBarRaw - base0) || 0.01;

  let maxDots=1, minDots=0;
  if(dotsKey){ const dv=data.map(p=>+p[dotsKey]); maxDots=Math.max(...dv,0.01); minDots=Math.min(...dv); }

  let out='';
  out+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#FFFFFF"/>`;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=yBase-t*chartH;
    const v=base0+t*span;
    let lbl;
    if(v===0) lbl='0';
    else if(v>=10000) lbl=(v/1000).toFixed(0)+'k';
    else if(v>=1000) lbl=(v/1000).toFixed(1)+'k';
    else lbl=v>=10?Math.round(v):f(v,1);
    out+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="#EEEEEE" stroke-width="1"/>`;
    out+=`<text x="${pad.l-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="8.5" fill="#CCCCCC">${lbl}</text>`;
  });
  const lgdClr=barColor==='team'?(activeTeam==='total'?TOTAL_COLOR:tc(activeTeam)):(barColor||'#1A7CC2');
  out+=`<text x="${pad.l}" y="14" font-family="Barlow Condensed" font-size="9" fill="${lgdClr}">▪ ${barLabel}</text>`;
  if(dotsKey) out+=`<text x="${pad.l+120}" y="14" font-family="Barlow Condensed" font-size="9" fill="#555">● ${dotsLabel}</text>`;

  const pts=[];
  data.forEach((p,i)=>{
    const cx=pad.l+(i+0.5)*slotW;
    const bh=Math.max(((+p[barKey]-base0)/span)*chartH,2);
    const by=yBase-bh;
    const clr=barColor==='team'?barClrFor(p):(barColor||'#1A7CC2');
    out+=`<rect x="${(cx-BW/2).toFixed(1)}" y="${by.toFixed(1)}" width="${BW.toFixed(1)}" height="${bh.toFixed(1)}" fill="${clr}" opacity="0.88" rx="2"/>`;
    const bv=+p[barKey];
    let bs;
    if(barFormat) bs=barFormat(bv);
    else if(barKey==='total_dist') bs=Math.round(bv)+'';
    else bs=bv>=10?Math.round(bv)+'':(Math.abs(bv-Math.round(bv))<0.01?Math.round(bv)+'':f(bv,1));
    out+=`<text x="${cx.toFixed(1)}" y="${(by-2).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="8" font-weight="700" fill="#333">${bs}</text>`;
    // etiqueta fecha+rival rotada
    const ny=yBase+6;
    out+=`<text x="${cx.toFixed(1)}" y="${ny.toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="9.5" fill="#444" font-weight="600" transform="rotate(${nameAngle},${cx.toFixed(1)},${ny.toFixed(1)})">${p._ejelbl}</text>`;
    if(dotsKey){
      const range=maxDots-minDots||1;
      const dy=yBase-((+p[dotsKey]-minDots)/range)*chartH*0.80-chartH*0.06;
      pts.push({x:cx,y:dy,val:+p[dotsKey]});
    }
  });
  if(dotsKey && pts.length){
    if(pts.length>1){
      const d2=pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      out+=`<path d="${d2}" fill="none" stroke="#999" stroke-width="1.2" opacity="0.5"/>`;
    }
    pts.forEach(p=>{
      out+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.5" fill="#555" opacity="0.8"/>`;
      const dv=dotsFormat?dotsFormat(p.val):f(p.val,1);
      const isTop=p.y<pad.t+chartH*0.28;
      const lvy=isTop?p.y+13:p.y-7;
      out+=`<text x="${p.x.toFixed(1)}" y="${lvy.toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="8" fill="#777" opacity="0.9">${dv}</text>`;
    });
  }
  return `<div class="cso"><svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${out}</svg></div>`;
}

// Línea pura (velocidad / minutos) con promedio
function svgLine(data, key, label, fmt, color, nameAngle=-45){
  const n=data.length;
  if(!n) return '<p style="color:#ccc;font-family:var(--fbc);text-align:center;padding:14px">Sin datos</p>';
  const slotW=34, nameH=58, pad={t:28,r:10,b:8,l:40};
  const chartH=140, H=pad.t+chartH+nameH+pad.b;
  const W=Math.max(n*slotW+pad.l+pad.r,460);
  const yBase=pad.t+chartH;
  const vals=data.map(p=>+p[key]||0);
  const mean=vals.reduce((s,v)=>s+v,0)/n;
  const maxV=Math.max(...vals)*1.12||1;
  const minV=Math.min(0,...vals);
  const range=(maxV-minV)||1;
  let out='';
  out+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#FFFFFF"/>`;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=yBase-t*chartH; const v=minV+t*range;
    out+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="#EEEEEE" stroke-width="1"/>`;
    out+=`<text x="${pad.l-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="8.5" fill="#CCCCCC">${fmt?fmt(v):(v>=10?Math.round(v):f(v,1))}</text>`;
  });
  const avgY=yBase-((mean-minV)/range)*chartH;
  out+=`<line x1="${pad.l}" y1="${avgY.toFixed(1)}" x2="${W-pad.r}" y2="${avgY.toFixed(1)}" stroke="${color}" stroke-width="1.4" stroke-dasharray="5,3" opacity="0.6"/>`;
  out+=`<text x="${W-pad.r-2}" y="${(avgY-4).toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="9" fill="${color}" font-weight="700">Prom ${fmt?fmt(mean):f(mean,1)}</text>`;
  out+=`<text x="${pad.l}" y="16" font-family="Barlow Condensed" font-size="9" fill="${color}">● ${label}</text>`;
  const pts=data.map((p,i)=>({x:pad.l+(i+0.5)*slotW,y:yBase-(((+p[key]||0)-minV)/range)*chartH,val:+p[key]||0,lbl:p._ejelbl}));
  if(pts.length>1){
    const d=pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    out+=`<path d="${d}" fill="none" stroke="${color}" stroke-width="2" opacity="0.85"/>`;
  }
  pts.forEach(p=>{
    out+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3.5" fill="${color}" stroke="#fff" stroke-width="1.5"/>`;
    const lvy=p.y<pad.t+18?p.y+13:p.y-7;
    out+=`<text x="${p.x.toFixed(1)}" y="${lvy.toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="8.5" fill="${color}" font-weight="700">${fmt?fmt(p.val):(p.val>=10?Math.round(p.val):f(p.val,1))}</text>`;
    const ny=yBase+6;
    out+=`<text x="${p.x.toFixed(1)}" y="${ny.toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="9.5" fill="#444" font-weight="600" transform="rotate(${nameAngle},${p.x.toFixed(1)},${ny.toFixed(1)})">${p.lbl}</text>`;
  });
  return `<div class="cso"><svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${out}</svg></div>`;
}

// Accel / Decel (doble barra)
function accelChart(data){
  const d=data.filter(p=>p.accel_count>0||p.decel_count>0);
  if(!d.length) return '<p style="color:#ccc;font-family:var(--fbc);text-align:center;padding:14px">Sin datos</p>';
  const n=d.length, slotW=34, nameH=58, pad={t:22,r:8,b:6,l:38};
  const chartH=148, H=pad.t+chartH+nameH+pad.b;
  const W=Math.max(n*slotW+pad.l+pad.r,460);
  const barW=7, gap=1;
  const maxV=Math.max(...d.map(p=>Math.max(p.accel_count,p.decel_count)))||1;
  const yBase=pad.t+chartH;
  let out='';
  out+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#FFFFFF"/>`;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=yBase-t*chartH, v=Math.round(t*maxV);
    out+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="#EEEEEE" stroke-width="1"/>`;
    out+=`<text x="${pad.l-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="8.5" fill="#CCCCCC">${v}</text>`;
  });
  out+=`<text x="${pad.l}" y="14" font-family="Barlow Condensed" font-size="9" fill="#1A7CC2">▪ Aceleraciones</text>`;
  out+=`<text x="${pad.l+100}" y="14" font-family="Barlow Condensed" font-size="9" fill="#E05050">▪ Desaceleraciones</text>`;
  d.forEach((p,i)=>{
    const cx=pad.l+(i+0.5)*slotW;
    const x0=cx-barW-gap;
    const bha=Math.max((p.accel_count/maxV)*chartH,2); const bya=yBase-bha;
    out+=`<rect x="${x0.toFixed(1)}" y="${bya.toFixed(1)}" width="${barW}" height="${bha.toFixed(1)}" fill="#1A7CC2" opacity="0.88" rx="2"/>`;
    out+=`<text x="${(x0+barW/2).toFixed(1)}" y="${(bya-2).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="8" fill="#333">${Math.round(p.accel_count)}</text>`;
    const x1=cx+gap;
    const bhd=Math.max((p.decel_count/maxV)*chartH,2); const byd=yBase-bhd;
    out+=`<rect x="${x1.toFixed(1)}" y="${byd.toFixed(1)}" width="${barW}" height="${bhd.toFixed(1)}" fill="#E05050" opacity="0.88" rx="2"/>`;
    out+=`<text x="${(x1+barW/2).toFixed(1)}" y="${(byd-2).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="8" fill="#333">${Math.round(p.decel_count)}</text>`;
    const ny=yBase+6;
    out+=`<text x="${cx.toFixed(1)}" y="${ny.toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="9.5" fill="#444" font-weight="600" transform="rotate(-45,${cx.toFixed(1)},${ny.toFixed(1)})">${p._ejelbl}</text>`;
  });
  return `<div class="cso"><svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${out}</svg></div>`;
}

// RHIE: 3 barras (total, media, máx)
function rhieChart(data){
  const d=data.filter(p=>p.rhie>0);

    out+=`<text x="${(x0+bW/2).toFixed(1)}" y="${(yBase-bh1-2).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="7.5" fill="#2E7D32">${p.rhie}</text>`;
    out+=`<rect x="${x1.toFixed(1)}" y="${(yBase-bh2).toFixed(1)}" width="${(bW-1).toFixed(1)}" height="${bh2.toFixed(1)}" fill="#1A7CC2" opacity="0.88" rx="2"/>`;
    out+=`<text x="${(x1+bW/2).toFixed(1)}" y="${(yBase-bh2-2).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="7.5" fill="#1A7CC2">${Math.round(p.rhie_mean)}</text>`;

    out+=`<text x="${(x2+bW/2).toFixed(1)}" y="${(yBase-bh3-2).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="7.5" fill="#C0392B">${p.rhie_max}</text>`;

  return `<div class="cso"><svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${out}</svg></div>`;

// BiG: distribución apilada (corta/media/larga) + prom x fecha. Más bajo = mejor.
function bigChart(data){
  const d=data.filter(p=>p.big_total>0);
  if(!d.length) return '<p style="color:#ccc;font-family:var(--fbc);text-align:center;padding:14px">Sin datos</p>';
  const toggle=`<div style="display:flex;gap:4px;margin-bottom:8px">
    <div class="ctab ${bigViewMode==='stacked'?'active':''}" onclick="setBigView('stacked')">Distribución</div>
    <div class="ctab ${bigViewMode==='avg'?'active':''}" onclick="setBigView('avg')">Prom. x fecha</div>
  </div>
  <div style="font-family:var(--fbc);font-size:9px;color:#999;margin-bottom:6px">⬇ Menor tiempo BiG es mejor</div>`;
  if(bigViewMode==='avg'){
    return toggle+bigAvgChart(d);
  }
  const maxT=Math.max(...d.map(p=>p.big_total));
  let rows=`<div class="big-legend" style="display:flex;gap:8px;margin-bottom:6px">
    <div style="display:flex;align-items:center;gap:3px;font-family:var(--fbc);font-size:10px;color:#aaa"><div style="width:8px;height:8px;border-radius:2px;background:#5CB85C"></div>Corta</div>
    <div style="display:flex;align-items:center;gap:3px;font-family:var(--fbc);font-size:10px;color:#aaa"><div style="width:8px;height:8px;border-radius:2px;background:#F0C040"></div>Media</div>
    <div style="display:flex;align-items:center;gap:3px;font-family:var(--fbc);font-size:10px;color:#aaa"><div style="width:8px;height:8px;border-radius:2px;background:#FF4444"></div>Larga</div>
  </div>`;
  rows+=d.map(p=>{
    const ws=maxT?Math.round(p.big_short/maxT*100):0;
    const wm=maxT?Math.round(p.big_med/maxT*100):0;
    const wl=maxT?Math.round(p.big_long/maxT*100):0;
    return `<div style="display:flex;align-items:center;gap:5px;margin-bottom:5px">
      <div style="font-family:var(--fbc);font-size:10px;font-weight:700;width:92px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)">${p._ejelbl}</div>
      <div style="flex:1;height:13px;border-radius:3px;overflow:hidden;display:flex;background:var(--bg4)">
        <div style="width:${ws}%;background:#5CB85C;height:100%"></div>
        <div style="width:${wm}%;background:#F0C040;height:100%"></div>
        <div style="width:${wl}%;background:#FF4444;height:100%"></div>
      </div>
      <div style="font-family:var(--fbc);font-size:10px;color:#bbb;width:52px;text-align:right;flex-shrink:0">${p.big_short}·${p.big_med}·${p.big_long}</div>
      <div style="font-family:var(--fbc);font-size:11px;font-weight:700;width:40px;text-align:right;flex-shrink:0;color:#888">${f(p.big_avg_time,2)}s</div>
    </div>`;
  }).join('');
  return toggle+rows;
}

// BiG prom. x fecha: línea + puntos. Menor es mejor: puntos por debajo del
// promedio del jugador en verde, por encima en rojo (igual que el index).
function bigAvgChart(data){
  const n=data.length;
  if(!n) return '<p style="color:#ccc;font-family:var(--fbc);text-align:center;padding:14px">Sin datos</p>';
  const slotW=34, nameH=58, pad={t:28,r:10,b:8,l:40};
  const chartH=140, H=pad.t+chartH+nameH+pad.b;
  const W=Math.max(n*slotW+pad.l+pad.r,460);
  const yBase=pad.t+chartH;
  const vals=data.map(p=>+p.big_avg_time||0);
  const mean=vals.reduce((s,v)=>s+v,0)/n;
  const maxV=Math.max(...vals)*1.12||1;
  const minV=Math.min(0,...vals);
  const range=(maxV-minV)||1;
  let out='';
  out+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#FFFFFF"/>`;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=yBase-t*chartH; const v=minV+t*range;
    out+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="#EEEEEE" stroke-width="1"/>`;
    out+=`<text x="${pad.l-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="8.5" fill="#CCCCCC">${f(v,1)}s</text>`;
  });
  const avgY=yBase-((mean-minV)/range)*chartH;
  out+=`<line x1="${pad.l}" y1="${avgY.toFixed(1)}" x2="${W-pad.r}" y2="${avgY.toFixed(1)}" stroke="#1A7CC2" stroke-width="1.4" stroke-dasharray="5,3" opacity="0.6"/>`;
  out+=`<text x="${W-pad.r-2}" y="${(avgY-4).toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="9" fill="#1A7CC2" font-weight="700">Prom ${f(mean,2)}s</text>`;
  out+=`<text x="${pad.l}" y="16" font-family="Barlow Condensed" font-size="9" fill="#555">● Prom BiG por fecha</text>`;
  const pts=data.map((p,i)=>({x:pad.l+(i+0.5)*slotW,y:yBase-(((+p.big_avg_time||0)-minV)/range)*chartH,val:+p.big_avg_time||0,lbl:p._ejelbl,better:(+p.big_avg_time||0)<=mean}));
  if(pts.length>1){
    const dpath=pts.map((p,i)=>`${i?'L':'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    out+=`<path d="${dpath}" fill="none" stroke="#999" stroke-width="1.5" opacity="0.5"/>`;
  }
  pts.forEach(p=>{
    const clr=p.better?'#2E7D32':'#C0392B';
    out+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${clr}" stroke="#fff" stroke-width="1.5"/>`;
    const lvy=p.y<pad.t+18?p.y+13:p.y-7;
    out+=`<text x="${p.x.toFixed(1)}" y="${lvy.toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="8.5" fill="${clr}" font-weight="700">${f(p.val,2)}s</text>`;
    const ny=yBase+6;
    out+=`<text x="${p.x.toFixed(1)}" y="${ny.toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="9.5" fill="#444" font-weight="600" transform="rotate(-45,${p.x.toFixed(1)},${ny.toFixed(1)})">${p.lbl}</text>`;
  });
  const legend=`<div style="display:flex;gap:10px;margin-top:6px;font-family:var(--fbc);font-size:9px;color:#888">
      <span style="color:#2E7D32">● por debajo del prom (mejor)</span>
      <span style="color:#C0392B">● por encima del prom</span>
    </div>`;
  return `<div class="cso"><svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${out}</svg></div>`+legend;
}

function setBigView(mode){ bigViewMode=mode; render(); }
function setSort(mode,el){ sortMode=mode; document.querySelectorAll('#sort-tabs .ptab').forEach(b=>b.classList.remove('active')); el.classList.add('active'); render(); }
function setSummaryMode(mode){ summaryMode=mode; render(); }
function setVelMode(mode){ velMode=mode; render(); }

function attachDrag(){
  document.querySelectorAll('.cso').forEach(el=>{
    let dn=false,sx,sl;
    el.onmousedown=e=>{dn=true;sx=e.pageX-el.offsetLeft;sl=el.scrollLeft;e.preventDefault()};
    document.onmouseup=()=>dn=false;
    document.onmousemove=e=>{if(!dn)return;el.scrollLeft=sl-(e.pageX-el.offsetLeft-sx)*1.2};
  });
}

// ══════════════════════════════════════════════════════════════════
//  MEDALLERO — 3 velocidades más rápidas del año (con partido)
// ══════════════════════════════════════════════════════════════════
function velPodium(data){
  const sorted=[...data].filter(p=>+p.max_vel>0).sort((a,b)=>b.max_vel-a.max_vel).slice(0,3);
  if(!sorted.length) return '';
  const mx=sorted[0].max_vel||1;
  const cls=['gold','silver','bronze'],med=['🥇','🥈','🥉'];
  return sorted.map((p,i)=>`
    <div class="pod ${cls[i]}">
      <div class="pod-medal">${med[i]}</div>
      <div class="pod-info">
        <div class="pod-name">${p._ejelbl}</div>
        <div class="pod-sub">${f(p.total_mins,0)} min · ${p.team}</div>
      </div>
      <div class="pod-nums">
        <div class="pod-vel">${f(p.max_vel,2)}<span style="font-size:11px;color:#bbb"> km/h</span></div>
        <div class="pod-pct">${f(p.max_vel_pct,1)}% V.Máx</div>
      </div>
      <div class="pod-bar"><div class="pod-fill" style="width:${(p.max_vel/mx*100).toFixed(1)}%"></div></div>
    </div>`).join('');
}

function buildSummary(data){
  const d30 = data.filter(p=>p.total_mins>=30);
  const base = d30.length?d30:data;
  const nMatches = data.length; // partidos TOTALES jugados

  // promedio o máximo de un campo sobre base (+30 min)
  const agg = (k)=> summaryMode==='avg' ? avg(base,k) : Math.max(...base.map(p=>+p[k]||0));
  // BiG: menor es mejor -> en modo máximo mostramos el MÍNIMO
  const aggBig = ()=> summaryMode==='avg' ? avg(base,'big_avg_time') : Math.min(...base.map(p=>+p.big_avg_time||0).filter(v=>v>0));

  // Datos de identidad (del primer registro disponible)
  const first = base[0] || data[0] || {};
  const {nombre, apellido} = splitName(selectedPlayer);

  // helpers de formato
  const km = v => v>=1000 ? (v/1000).toFixed(2)+'km' : Math.round(v)+'m';

  // Stats de la tarjeta, según toggle (promedio o máximo).
  // Vel Máx y % Vel máx también siguen el toggle.
  const r1=[
    {v:Math.round(agg('total_mins'))+"'", l:'Mins'},
    {v:f(agg('max_vel'),1), l:'Vel Máx'},
    {v:f(agg('max_vel_pct'),0)+'%', l:'% Vel máx'},
  ];
  const r2=[
    {v:km(agg('total_dist')), l:'Dist'},
    {v:Math.round(agg('ai18'))+'m', l:'HSR'},
    {v:Math.round(agg('dt25'))+'m', l:'Sprint'},
  ];
  const r3=[
    {v:Math.round(agg('accel_count'))+'', l:'Acel'},
    {v:Math.round(agg('decel_count'))+'', l:'Decel'},
  ];
  const r4=[
    {v:Math.round(agg('contacts'))+'', l:'Cont.'},
    {v:f(aggBig(),2)+'s', l:'BiG'},
  ];
  const stat = s => `<div class="fc-stat"><span class="fc-sv">${s.v}</span><div class="fc-sep"></div><span class="fc-sl">${s.l}</span></div>`;

  const toggle=`<div class="summary-toggle">
    <div class="ctab ${summaryMode==='avg'?'active':''}" onclick="setSummaryMode('avg')">Promedio</div>
    <div class="ctab ${summaryMode==='max'?'active':''}" onclick="setSummaryMode('max')">Máximo</div>
  </div>`;

  const card=`<div class="fifa-wrap"><div class="fifa-card">
    <div class="fc-top">
      <div class="fc-pj">
        <div class="fc-pj-v">${nMatches}</div>
        <div class="fc-pj-l">Partidos</div>
      </div>
      <img class="fc-logo" src="${LOGO_CASI}" alt="CASI">
      <div class="fc-pos-wrap">
        <div class="fc-pos">${posLabel(first.position||'')}</div>
      </div>
    </div>
    <div class="fc-name">
      <span class="fc-first">${nombre||''}</span>
      <span class="fc-last">${apellido||selectedPlayer}</span>
    </div>
    <div class="fc-grid">${r1.map(stat).join('')}</div>
    <div class="fc-grid">${r2.map(stat).join('')}</div>
    <div class="fc-grid-2">${r3.map(stat).join('')}</div>
    <div class="fc-grid-2">${r4.map(stat).join('')}</div>
  </div></div>`;

  const note = (summaryMode==='avg'?'Promedios':'Máximos') + ' sobre partidos de +30 min · BiG: menor es mejor';
  return toggle+card+`<div class="fifa-note">${note}</div>`;
}

function teamClass(t){return t==='total'?'at':t==='Primera'?'ap':t==='Intermedia'?'ai':'aa';}

function refreshTeamTabs(){
  const teams = selectedPlayer?playerTeams(selectedPlayer):new Set(['Primera','Intermedia','Pre A']);
  document.querySelectorAll('#team-tabs .ftab').forEach(b=>{
    const t=b.getAttribute('data-team');
    b.classList.remove('ap','ai','aa','at','dim');
    if(t!=='total' && !teams.has(t)) b.classList.add('dim');
    if(t===activeTeam) b.classList.add(teamClass(t));
  });
}

function setTeam(t,el){ activeTeam=t; refreshTeamTabs(); render(); }

let PLAYER_NAMES = [];        // orden alfabético por apellido
let menuOpen = false;

function populatePlayerSelect(){
  PLAYER_NAMES = Object.keys(PLAYER_INDEX).sort((a,b)=>{
    const A=splitName(a).apellido, B=splitName(b).apellido;
    return A.localeCompare(B);
  });
  if(!selectedPlayer || !PLAYER_INDEX[selectedPlayer]) selectedPlayer=PLAYER_NAMES[0]||'';
  document.getElementById('player-input').value = selectedPlayer?fmtName(selectedPlayer):'';
  renderPlayerMenu('');
}

// Dibuja las opciones del menú filtradas por q (substring sobre nombre y display)
function renderPlayerMenu(q){
  q=(q||'').trim().toLowerCase();
  const menu=document.getElementById('player-menu');
  const list = q ? PLAYER_NAMES.filter(n=> n.toLowerCase().includes(q) || fmtName(n).toLowerCase().includes(q)) : PLAYER_NAMES;
  if(!list.length){
    menu.innerHTML = '<div class="empty">Sin resultados</div>';
    return;
  }
  menu.innerHTML = list.map(n=>{
    const disp=fmtName(n);
    const sel = n===selectedPlayer ? ' sel':'';
    return `<div class="opt${sel}" data-name="${n.replace(/"/g,'&quot;')}" onclick="pickPlayer(this.getAttribute('data-name'))">${disp}</div>`;
  }).join('');
}

function openPlayerMenu(){
  // Al abrir, mostrar SIEMPRE la lista completa (sin filtrar por el jugador
  // ya elegido). Seleccionamos el texto para que al escribir se reemplace.
  renderPlayerMenu('');
  const inp=document.getElementById('player-input');
  try{ inp.select(); }catch(e){}
  document.getElementById('player-menu').classList.add('open');
  menuOpen=true;
}
function closePlayerMenu(){
  document.getElementById('player-menu').classList.remove('open');
  menuOpen=false;
}
function togglePlayerMenu(e){
  if(e) e.stopPropagation();
  if(menuOpen){ closePlayerMenu(); }
  else { document.getElementById('player-input').focus(); openPlayerMenu(); }
}
// Al escribir: filtra el menú (y lo abre si estaba cerrado)
function filterPlayerMenu(val){
  renderPlayerMenu(val);
  document.getElementById('player-menu').classList.add('open');
  menuOpen=true;
}
// Al elegir una opción del menú
function pickPlayer(name){
  closePlayerMenu();
  selectPlayer(name);
}
// Cerrar el menú al tocar fuera
document.addEventListener('click', function(e){
  if(!e.target.closest('#player-combo')) closePlayerMenu();
});

function selectPlayer(name){
  selectedPlayer=name;
  const inp=document.getElementById('player-input');
  if(inp) inp.value=fmtName(name);
  const teams=playerTeams(name);
  if(activeTeam!=='total' && !teams.has(activeTeam)) activeTeam='total';
  refreshTeamTabs();
  render();
}

function render(){
  if(!selectedPlayer){ document.getElementById('mc').innerHTML=''; return; }
  const data = playerSeries(selectedPlayer, activeTeam); // cronológico

  const first = data[0] || (PLAYER_INDEX[selectedPlayer] && Object.values(PLAYER_INDEX[selectedPlayer][0].byTeam)[0]);
  const metaEl=document.getElementById('player-meta');
  if(first){
    const d30=data.filter(p=>p.total_mins>=30).length;
    metaEl.innerHTML=`
      <div class="pm-chip">Puesto: <b>${posLabel(first.position)}</b></div>
      <div class="pm-chip">GPS: <b>${first.gps||'—'}</b></div>
      <div class="pm-chip">Partidos: <b>${data.length}</b></div>
      <div class="pm-chip">+30': <b>${d30}</b></div>`;
  } else metaEl.innerHTML='';

  if(!data.length){
    document.getElementById('mc').innerHTML=`<div style="padding:30px;text-align:center;font-family:var(--fbc);color:#bbb">Sin datos para <b>${fmtName(selectedPlayer)}</b> en ${activeTeam==='total'?'TOTAL':activeTeam}.</div>`;
    return;
  }

  // Datos ordenados por gráfico según sortMode
  const dMins   = orderFor(data,'total_mins',false);
  const dDist   = orderFor(data,'total_dist',false);
  const dAi     = orderFor(data,'ai18',false);
  const dSprint = orderFor(data,'dt25',false);
  const dAccel  = orderFor(data,'accel_count',false);
  const dRhie   = orderFor(data,'rhie',false);
  const dCont   = orderFor(data,'contacts',false);
  const dVel    = orderFor(data, velMode==='abs'?'max_vel':'max_vel_pct', false);
  const dBig    = orderFor(data,'big_avg_time',true); // menor mejor

  let h='';
  // RESUMEN
  h+=`<div class="sec"><div class="sec-ttl">RESUMEN DEL AÑO</div>${buildSummary(data)}</div>`;

  // MEDALLERO velocidad
  const pod=velPodium(data);
  if(pod) h+=`<div class="sec"><div class="sec-ttl">🏅 VELOCIDAD MÁX · TOP 3 DEL AÑO</div><div class="podium">${pod}</div></div>`;

  // VELOCIDAD con toggle km/h / %
  const velKey = velMode==='abs'?'max_vel':'max_vel_pct';
  const velFmt = velMode==='abs'?(v=>f(v,1)):(v=>f(v,1)+'%');
  const velLbl = velMode==='abs'?'Vel máx (km/h)':'% Vel máx';
  h+=`<div class="sec"><div class="sec-ttl">🏃 VELOCIDAD MÁXIMA</div>
    <div class="chart-toggle">
      <div class="ctab ${velMode==='abs'?'active':''}" onclick="setVelMode('abs')">km/h</div>
      <div class="ctab ${velMode==='pct'?'active':''}" onclick="setVelMode('pct')">% V.Máx</div>
    </div>
    ${svgBars({data:dVel,barKey:velKey,barLabel:velLbl,barColor:'team',barFormat:velFmt,yMin:velMode==='abs'?15:0})}</div>`;

  // MINUTOS POR PARTIDO (antes de distancia)
  h+=`<div class="sec"><div class="sec-ttl">⏱️ MINUTOS POR PARTIDO</div>${svgBars({data:dMins,barKey:'total_mins',barLabel:'Minutos',barColor:'team',barFormat:v=>Math.round(v)+"'"})}</div>`;

  // DISTANCIA + m/min
  h+=`<div class="sec"><div class="sec-ttl">📏 DISTANCIA + M/MIN</div>${svgBars({data:dDist,barKey:'total_dist',barLabel:'Distancia (m)',barColor:'team',dotsKey:'avg_mpm',dotsLabel:'m/min',dotsFormat:v=>f(v,1)})}</div>`;

  h+=`<div class="sec"><div class="sec-ttl">🔥 ALTA INTENSIDAD >18 km/h</div>${svgBars({data:dAi,barKey:'ai18',barLabel:'>18 km/h (m)',barColor:'team',dotsKey:'ai_pct',dotsLabel:'AI %',dotsFormat:v=>f(v,1)+'%'})}</div>`;
  h+=`<div class="sec"><div class="sec-ttl">💨 SPRINT +25 km/h</div>${svgBars({data:dSprint,barKey:'dt25',barLabel:'>25 km/h (m)',barColor:'team',dotsKey:'sprint_count',dotsLabel:'Nº esfuerzos',dotsFormat:v=>Math.round(v)+''})}</div>`;
  h+=`<div class="sec"><div class="sec-ttl">⚡ ACELERACIONES / DESACELERACIONES</div>${accelChart(dAccel)}</div>`;
  h+=`<div class="sec"><div class="sec-ttl">📊 RHIE</div>${rhieChart(dRhie)}</div>`;
  h+=`<div class="sec"><div class="sec-ttl">💥 CONTACTOS</div>${svgBars({data:dCont,barKey:'contacts',barLabel:'Total contactos',barColor:'team'})}</div>`;
  h+=`<div class="sec"><div class="sec-ttl">🔁 VUELTA AL JUEGO (BiG)</div>${bigChart(dBig)}</div>`;

  document.getElementById('mc').innerHTML=h;
  attachDrag();
}

// ══════════════════════════════════════════════════════════════════
//  Inicialización
// ══════════════════════════════════════════════════════════════════
(async function(){
  try{ document.getElementById('hdr-logo').src = LOGO_CASI; }catch(e){}
  const overlay=document.getElementById('loading-overlay');
  let ok=0;
  const results = await Promise.allSettled(FECHAS_CONFIG.map(cfg=>fetchFecha(cfg)));
  results.forEach(r=>{ if(r.status==='fulfilled') ok++; });
  if(ok===0){
    overlay.innerHTML='<div style="padding:40px;text-align:center;font-family:Barlow Condensed,sans-serif;color:#e44;font-size:14px;">No se pudieron cargar los datos.<br>Verificá tu conexión e intentá de nuevo.</div>';
    return;
  }
  buildPlayerIndex();
  populatePlayerSelect();
  refreshTeamTabs();
  render();
  overlay.remove();
})();
</script>
</body>
</html>
