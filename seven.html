<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Seven 2026 · URBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F7F7;--fg:#111;--cel:#1A7CC2;
  --bg2:#fff;--bg3:#EFEFEF;--bg4:#E2E2E2;--bord:#DCDCDC;
  --gold:#C8960C;--silver:#777;--bronze:#8B4513;--win:#2E7D32;
  --cp:#1A7CC2;--ci:#C47000;--ca:#3A8A2A;
  --fbc:"Barlow Condensed",sans-serif;--fb:"Barlow",sans-serif;
}
body{background:var(--bg);color:var(--fg);font-family:var(--fb);max-width:480px;margin:0 auto;min-height:100vh}
.hdr{background:#fff;border-bottom:3px solid var(--cel);padding:9px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:60;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.hdr img{height:38px;width:38px;object-fit:contain;flex-shrink:0}
.hdr-info{flex:1;min-width:0}
.hdr-info h1{font-family:var(--fbc);font-weight:900;font-size:16px;line-height:1.1;color:var(--fg)}
.hdr-info p{font-size:10px;color:var(--cel);font-family:var(--fbc);font-weight:600;letter-spacing:.5px}
.hdr-badge{margin-left:auto;text-align:right;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.nav-btn{background:var(--cel);color:#fff;font-family:var(--fbc);font-weight:700;font-size:10px;border:none;border-radius:14px;padding:5px 10px;cursor:pointer;text-decoration:none;letter-spacing:.3px;white-space:nowrap}
.hb-score{font-family:var(--fbc);font-size:24px;font-weight:900;line-height:1;color:var(--fg)}
.hb-score .sep{color:var(--cel)}
.hb-label{font-size:9px;color:#aaa;font-family:var(--fbc)}
.hb-label b.win{color:var(--win)}.hb-label b.loss{color:#C62828}
.flt{background:#fff;border-bottom:2px solid var(--bord);padding:6px 10px;display:flex;flex-direction:column;gap:5px;position:sticky;top:60px;z-index:59;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.flt-lbl{font-family:var(--fbc);font-size:9px;color:#aaa;font-weight:700;letter-spacing:.8px;margin-bottom:2px}
.flt-row{display:flex;gap:4px}
.prow{display:flex;gap:3px;flex-wrap:wrap}
.ptab{padding:3px 6px;font-family:var(--fbc);font-weight:700;font-size:10px;cursor:pointer;border-radius:3px;color:#aaa;background:var(--bg3);border:1px solid var(--bord);transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.ptab.active{color:var(--fg);background:var(--bg4);border-color:#999;font-weight:900}
.sec{padding:11px 10px 4px}
.sec-ttl{font-family:var(--fbc);font-size:11px;font-weight:700;color:#bbb;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.sec-ttl::after{content:'';flex:1;height:1px;background:var(--bord)}
.kpi{background:#fff;border:1px solid var(--bord);border-radius:7px;padding:7px 8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.kpi-lbl{font-family:var(--fbc);font-size:8px;color:#bbb;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.kpi-v{font-family:var(--fbc);font-size:19px;font-weight:900;line-height:1.1;color:var(--fg)}
.kpi-u{font-size:10px;color:#bbb;font-weight:400}
.podium{display:flex;flex-direction:column;gap:5px}
.pod{background:#fff;border:1px solid var(--bord);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.pod.gold{border-color:var(--gold);border-width:2px}.pod.silver{border-color:var(--silver);border-width:2px}.pod.bronze{border-color:var(--bronze);border-width:2px}
.pod-medal{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.pod-info{flex:1;min-width:0}
.pod-name{font-family:var(--fbc);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.pod-sub{font-size:10px;color:#bbb}
.pod-nums{text-align:right;flex-shrink:0}
.pod-vel{font-family:var(--fbc);font-size:22px;font-weight:900;line-height:1;color:var(--fg)}
.pod-pct{font-size:10px;color:#aaa}
.pod-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--bg4)}
.pod-fill{height:3px}
.pod.gold .pod-fill{background:var(--gold)}.pod.silver .pod-fill{background:var(--silver)}.pod.bronze .pod-fill{background:var(--bronze)}
.fecha-dd{position:relative}
.fecha-dd p{font-size:10px;color:var(--cel);font-family:var(--fbc);font-weight:600;letter-spacing:.5px;margin:0}
.fecha-opts{display:none;position:fixed;background:#fff;border:1px solid var(--bord);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.12);z-index:9999;min-width:200px;overflow-y:auto;max-height:260px;-webkit-overflow-scrolling:touch}
.fecha-opts div{padding:8px 12px;font-family:var(--fbc);font-size:12px;font-weight:600;color:var(--fg);cursor:pointer}
.fecha-opts div:hover{background:var(--bg3)}
.fecha-opts div.active{color:var(--cel)}
.fecha-opts .opts-sep{padding:4px 12px;font-size:9px;color:#bbb;font-weight:700;letter-spacing:1px;background:var(--bg3);cursor:default}
.chart-toggle{display:flex;gap:4px;margin-bottom:8px}
.ctab{padding:4px 10px;font-family:var(--fbc);font-weight:700;font-size:11px;cursor:pointer;border-radius:4px;color:#aaa;background:var(--bg3);border:1px solid var(--bord);transition:all .15s;user-select:none;-webkit-tap-highlight-color:transparent}
.ctab.active{color:#fff;background:var(--cp);border-color:var(--cp)}
.cso{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;cursor:grab}
.cso:active{cursor:grabbing}
.cso svg{display:block}
.big-legend{display:flex;gap:8px;margin-bottom:6px}
.bl{display:flex;align-items:center;gap:3px;font-family:var(--fbc);font-size:10px;color:#aaa}
.bldot{width:8px;height:8px;border-radius:2px}
.srow{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.sname{font-family:var(--fbc);font-size:11px;font-weight:600;width:115px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.strack{flex:1;height:13px;border-radius:3px;overflow:hidden;display:flex;background:var(--bg4)}
.sseg{height:100%}
.ss{background:#5CB85C}.sm{background:#F0C040}.sl{background:#FF4444}
.sval{font-family:var(--fbc);font-size:11px;font-weight:700;min-width:20px;text-align:right;flex-shrink:0}
.savg{font-family:var(--fbc);font-size:10px;color:#aaa;min-width:36px;text-align:right;flex-shrink:0}
.sheader{display:flex;align-items:center;gap:5px;margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid var(--bord)}
.sheader .sname{color:#bbb;font-size:9px;letter-spacing:.5px}
.sheader .sval{color:#bbb;font-size:9px}
.sheader .savg{color:#bbb;font-size:9px}
.footer{text-align:center;padding:16px 10px;font-family:var(--fbc);font-size:10px;color:#ccc;border-top:1px solid var(--bord);margin-top:8px}
::-webkit-scrollbar{height:3px;width:3px}
::-webkit-scrollbar-track{background:var(--bg3)}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px}

/* ERU semaphore */

.sc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px 6px;padding:2px 0}
.sc-cell{display:flex;align-items:center;justify-content:center;border-radius:7px;border-width:2px;border-style:solid;padding:7px 5px;min-height:34px}
.sc-name{font-family:var(--fbc);font-size:13px;font-weight:700;color:var(--fg);text-align:center;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}

/* FIFA card */
.fut-selector-wrap{padding:0 0 10px;display:flex;flex-direction:column;gap:6px}
.fut-selector-wrap label{font-family:var(--fbc);font-size:9px;color:#aaa;font-weight:700;letter-spacing:.8px}
.fut-selector-wrap select{font-family:var(--fbc);font-size:13px;font-weight:600;color:var(--fg);background:var(--bg2);border:1px solid var(--bord);border-radius:6px;padding:6px 10px;outline:none;width:100%}
.fut-cards-row{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:4px 0 20px}
.fifa-card{width:176px;position:relative;padding:8px 11px 54px 11px;font-family:var(--fbc);box-shadow:0 8px 32px rgba(0,0,0,0.45);flex-shrink:0;background:repeating-conic-gradient(from 0deg at 50% 110%,rgba(255,255,255,0.07) 0deg,transparent 2deg,transparent 5deg,rgba(255,255,255,0.04) 6deg,transparent 8deg),linear-gradient(160deg,#f7e87a 0%,#d4a017 15%,#f0cc50 30%,#c8900a 45%,#f5d848 55%,#b8780a 70%,#e8c040 82%,#a06010 92%,#c8a030 100%);clip-path:path('M 14 0 Q 0 0 0 14 L 0 255 Q 0 271 13 271 Q 70 271 88 290 Q 106 271 163 271 Q 176 271 176 255 L 176 14 Q 176 0 162 0 Z')}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px}
.card-num-top{font-family:var(--fbc);font-size:26px;font-weight:900;color:rgba(60,30,0,.72);line-height:1}
.card-pos-lbl{font-family:var(--fbc);font-size:8px;font-weight:700;color:rgba(60,30,0,.6);text-transform:uppercase;line-height:1.2;max-width:78px}
.card-logo-img{height:34px;width:34px;object-fit:contain;border-radius:50%}
.card-name-wrap{text-align:center;margin-bottom:6px;margin-top:30px;line-height:1.2;padding:4px 0;border-top:1px solid rgba(0,0,0,.14);border-bottom:1px solid rgba(0,0,0,.14)}
.card-first-name{font-family:var(--fbc);font-size:9px;font-weight:600;color:rgba(60,28,0,.65);text-transform:uppercase;letter-spacing:.8px;display:block}
.card-last-name{font-family:var(--fbc);font-size:12px;font-weight:900;color:rgba(50,20,0,.92);text-transform:uppercase;letter-spacing:1.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-stats-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px 3px;margin-bottom:4px}
.card-stats-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:4px 3px;margin-bottom:4px;padding:0 14px}
.card-stat-item{display:flex;flex-direction:column;align-items:center}
.card-stat-val{font-family:var(--fbc);font-size:12px;font-weight:900;color:rgba(60,30,0,.72);white-space:nowrap;line-height:1.15}
.card-stat-sep{width:16px;height:1px;background:rgba(100,50,0,.2);margin:2px auto}
.card-stat-lbl{font-family:var(--fbc);font-size:7.5px;font-weight:700;color:rgba(80,38,0,.62);letter-spacing:.3px}

#install-btn{display:none;position:fixed;bottom:14px;right:14px;background:var(--cel);color:#fff;font-family:var(--fbc);font-weight:700;font-size:12px;border:none;border-radius:20px;padding:9px 18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:100}
#install-btn.show{display:block}
#ios-banner{display:none;position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--fg);color:#fff;padding:12px 14px;font-family:var(--fbc);font-size:12px;text-align:center;z-index:200}
#ios-banner.show{display:block}
#ios-banner-close{position:absolute;top:8px;right:12px;background:none;border:none;color:#fff;font-size:16px;cursor:pointer}
</style>
</head>

// ─── HELPERS ───────────────────────────────────────────────────────────────
function tc(){ return '#1A7CC2'; }
function f(v,d=0){ return (+v).toFixed(d); }
function avg(arr,k){ return arr.length?arr.reduce((s,p)=>s+p[k],0)/arr.length:0; }

const DOUBLE_SURNAMES = new Set([
  'Gomez Salaverri','Montes de Oca','Rocca Rivarola','Dominguez Perdigón',
  'Rocca Sackmann','Torres Obeid','Saenz de Miera'
]);
function fmtName(full){
  const p=full.trim().split(' ');
  if(p.length===1) return p[0];
  const last3=p.slice(-3).join(' ');
  const last2=p.slice(-2).join(' ');
  let apellido, nombre;
  if(p.length>=4&&DOUBLE_SURNAMES.has(last3)){ apellido=last3; nombre=p.slice(0,-3).join(' '); }
  else if(p.length>=3&&DOUBLE_SURNAMES.has(last2)){ apellido=last2; nombre=p.slice(0,-2).join(' '); }
  else { apellido=p[p.length-1]; nombre=p.slice(0,-1).join(' '); }
  return apellido+' '+nombre[0]+'.';
}

function apellido(name){
  const p=name.trim().split(' ');
  return p[p.length-1];
}
const POS_ORDER={'Seven':0};
function byGroup(arr,key,asc=false){
  return [...arr].sort((a,b)=>{
    if(sortMode==='perf') return asc?a[key]-b[key]:b[key]-a[key];
    if(sortMode==='mins') return b.total_mins-a.total_mins;
    if(sortMode==='name') return apellido(a.name).localeCompare(apellido(b.name));
    if(a.group_order!==b.group_order) return a.group_order-b.group_order;
    const pa=POS_ORDER[a.position]??99, pb=POS_ORDER[b.position]??99;
    if(pa!==pb) return pa-pb;
    return apellido(a.name).localeCompare(apellido(b.name));
  });
}
function posLabel(pos){ return pos||'SEVEN'; }

// ─── CSV PARSING ───────────────────────────────────────────────────────────
function parseEuro(s){ return parseFloat(String(s).replace(',','.'))||0; }

function csvNameToNormal(csvName){
  const comma=csvName.indexOf(',');
  if(comma>=0){
    const ap=csvName.slice(0,comma).trim();
    const nom=csvName.slice(comma+1).trim();
    return nom+' '+ap;
  }
  return csvName.trim();
}

function parseMatchKey(filename){
  const base=filename.replace('.csv','');
  const parts=base.split('-');
  const day=parts[0].toLowerCase();
  const casiScore=parts[parts.length-2];
  const rivalScore=parts[parts.length-1];
  const rival=parts.slice(1,parts.length-2).join(' ');
  return { day, rival, casiScore, rivalScore };
}

function parseCSV(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
  if(lines.length<2) return [];
  const players=[];
  for(let i=1;i<lines.length;i++){
    const row=lines[i].split(';');
    if(row.length<50) continue;
    if(String(row[1]).trim().toLowerCase()!=='session') continue;
    const csvName=String(row[C.name]).trim();
    if(!csvName) continue;
    const name=csvNameToNormal(csvName);
    const bigVal=parseEuro(row[C.big]);
    const p={
      name,
      team:'CASI',
      group:'Seven',
      group_order:0,
      position:'Seven',
      gps:'—',
      total_mins:parseEuro(row[C.mins]),
      total_dist:parseEuro(row[C.distTotal]),
      avg_mpm:parseEuro(row[C.mtsMin]),
      ai18:parseEuro(row[C.hsr]),
      ai_pct:parseEuro(row[C.hsrPct]),
      dt25:parseEuro(row[C.sprintDist]),
      sprint_count:parseEuro(row[C.sprintN]),
      max_vel:parseEuro(row[C.velMax]),
      max_vel_pct:parseEuro(row[C.velMaxPct]),
      accel_count:parseEuro(row[C.acc25]),
      decel_count:parseEuro(row[C.dec25]),
      accel_b3:parseEuro(row[C.accB3]),
      decel_b3:parseEuro(row[C.decB3]),
      rhie:parseEuro(row[C.rhie]),
      rhie_mean:parseEuro(row[C.rhieMean]),
      rhie_max:parseEuro(row[C.rhieMax]),
      contacts:parseEuro(row[C.contactos]),
      contacts_min:parseEuro(row[C.contactosMin]),
      big_avg_time:bigVal,
      big_total:bigVal>0?1:0,
      big_sum_time:bigVal,
      big_short:parseEuro(row[C.bigShort]),
      big_med:parseEuro(row[C.bigMed]),
      big_long:parseEuro(row[C.bigLong]),
      pl_min:parseEuro(row[C.plMin]),
      pl:parseEuro(row[C.pl]),
      dist_exp:parseEuro(row[C.distExp]),
      sprint_dist:parseEuro(row[C.sprintDist]),
      hsr_val:parseEuro(row[C.hsr]),
      mts_min:parseEuro(row[C.mtsMin]),
      ef_exp:parseEuro(row[C.efExp]),
      ef_exp_min:parseEuro(row[C.efExpMin]),
    };
    players.push(p);
  }
  return players;
}

// ─── DATOS ─────────────────────────────────────────────────────────────────
function getCumulative(dayFilter){
  const matches=dayFilter?MATCHES.filter(m=>m.day===dayFilter):MATCHES;
  if(!matches.length) return [];
  const byName={};
  matches.forEach(match=>{
    match.data.forEach(p=>{
      if(!byName[p.name]){
        byName[p.name]={...p,_matchCount:1,_rhiePeak:p.rhie};
      } else {
        const acc=byName[p.name];
        acc.total_dist+=p.total_dist;
        acc.ai18+=p.ai18;
        acc.dt25+=p.dt25;
        acc.accel_count+=p.accel_count;
        acc.decel_count+=p.decel_count;
        acc.accel_b3+=p.accel_b3;
        acc.decel_b3+=p.decel_b3;
        acc.contacts+=p.contacts;
        acc.total_mins+=p.total_mins;
        acc.rhie+=p.rhie;
        acc.big_total+=p.big_total;
        acc.big_short+=p.big_short;
        acc.big_med+=p.big_med;
        acc.big_long+=p.big_long;
        acc.big_sum_time+=p.big_sum_time;
        acc.sprint_count+=p.sprint_count;
        acc.pl+=p.pl;
        acc.dist_exp+=p.dist_exp;
        acc.hsr_val+=p.hsr_val;
        acc.ef_exp+=p.ef_exp;
        acc.max_vel=Math.max(acc.max_vel,p.max_vel);
        acc.max_vel_pct=Math.max(acc.max_vel_pct,p.max_vel_pct);
        acc._rhiePeak=Math.max(acc._rhiePeak,p.rhie);
        acc._matchCount++;
      }
    });
  });
  return Object.values(byName).map(p=>({
    ...p,
    avg_mpm:p.total_mins>0?p.total_dist/p.total_mins:0,
    ai_pct:p.total_dist>0?p.ai18/p.total_dist*100:0,
    big_avg_time:p.big_total>0?p.big_sum_time/p.big_total:0,
    pl_min:p.total_mins>0?p.pl/p.total_mins:0,
    mts_min:p.total_mins>0?p.total_dist/p.total_mins:0,
    contacts_min:p.total_mins>0?p.contacts/p.total_mins:0,
    ef_exp_min:p.total_mins>0?p.ef_exp/p.total_mins:0,
    rhie_mean:p._matchCount>0?p.rhie/p._matchCount:0,
    rhie_max:p._rhiePeak||p.rhie,
    sprint_dist:p.dt25,
  }));
}

function getDataset(){
  if(activeView==='total') return getCumulative(null);
  if(activeView==='sab')   return getCumulative('sab');
  if(activeView==='dom')   return getCumulative('dom');
  const match=MATCHES.find(m=>m.key===activeView);
  return match?match.data:[];
}

// ─── SEMÁFORO DE CARGA ──────────────────────────────────────────────────────────
function computeCargaPct(p){
  const ov=CARGA_OVERRIDES[p.name]||{};
  const limRhie   =ov.rhie   ||CARGA_LIMITS.rhie;
  const limDistExp=ov.distExp||CARGA_LIMITS.distExp;
  const pMins =(p.total_mins/CARGA_LIMITS.mins)   *100;
  const pRhie =(p.rhie      /limRhie)              *100;
  const pCont =(p.contacts  /CARGA_LIMITS.contacts)*100;
  const pDist =(p.dist_exp  /limDistExp)            *100;
  return (pMins+pRhie+pCont+pDist)/4;
}
function cargaColor(pct){
  if(pct>90)  return{bg:'#C62828',key:'alerta'};
  if(pct>=80) return{bg:'#C47000',key:'precaucion'};
  return{bg:'#2E7D32',key:'optimo'};
}
function setCargaFilter(key){
  cargaFilter=cargaFilter===key?null:key;
  render();
}
function buildSemaforoCarga(data){
  if(!data.length) return '';
  let playerScores;
  if(activeView==='total'||activeView==='sab'||activeView==='dom'){
    const matches=activeView==='total'?MATCHES:MATCHES.filter(m=>m.day===activeView);
    if(!matches.length) return '';
    const byName={};
    matches.forEach((match,idx)=>{
      const weight=1.0+idx*0.25;
      match.data.forEach(p=>{
        const pct=computeCargaPct(p);
        if(!byName[p.name]) byName[p.name]={wSum:0,wTotal:0};
        byName[p.name].wSum  +=pct*weight;
        byName[p.name].wTotal+=weight;
      });
    });
    playerScores=Object.entries(byName).map(([name,v])=>({name,pct:v.wSum/v.wTotal}));
  } else {
    playerScores=data.map(p=>({name:p.name,pct:computeCargaPct(p)}));
  }
  playerScores.sort((a,b)=>b.pct-a.pct);
  const counts={alerta:0,precaucion:0,optimo:0};
  playerScores.forEach(ps=>counts[cargaColor(ps.pct).key]++);
  const filtered=cargaFilter?playerScores.filter(ps=>cargaColor(ps.pct).key===cargaFilter):playerScores;
  const btnDefs=[
    {key:'alerta',    emoji:'\ud83d\udd34',label:'Alerta',    bg:'#C62828'},
    {key:'precaucion',emoji:'\ud83d\udfe1',label:'Precauci\u00f3n',bg:'#C47000'},
    {key:'optimo',    emoji:'\ud83d\udfe2',label:'\u00d3ptimo',    bg:'#2E7D32'},
  ];
  const toggles=btnDefs.map(b=>{
    const isActive=cargaFilter===b.key;
    const st=isActive?'background:'+b.bg+';border-color:'+b.bg+';color:#fff':'--cp:'+b.bg;
    return '<div class="ctab'+(isActive?' active':'')+'" style="'+st+'" onclick="setCargaFilter(\''+b.key+'\')">'+b.emoji+' '+b.label+' <span style="font-size:9px;opacity:.8">('+counts[b.key]+')</span></div>';
  }).join('');
  const gridItems=filtered.map(ps=>{
    const c=cargaColor(ps.pct);
    return '<div class="sc-cell" style="border-color:'+c.bg+';background:'+c.bg+'18"><span class="sc-name">'+fmtName(ps.name)+'</span></div>';
  }).join('');
  const emptyMsg=filtered.length===0?'<div style="font-family:var(--fbc);font-size:12px;color:#aaa;text-align:center;padding:16px;grid-column:1/-1">Sin jugadores</div>':'';
  return '<div class="chart-toggle" style="margin-bottom:10px">'+toggles+'</div><div class="sc-grid">'+(gridItems||emptyMsg)+'</div>';
}

// ─── CHART FUNCTIONS ───────────────────────────────────────────────────────
function svgBars({data,barKey,barLabel,barColor,dotsKey,dotsLabel,dotsColor,
                  dotsFormat,barFormat,nameAngle=-50,fullN=0}){
  const n=data.length;
  if(!n) return '<p style="color:#ccc;font-family:var(--fbc);text-align:center;padding:14px">Sin datos</p>';
  const nameH=46,pad={t:22,r:8,b:6,l:38},chartH=148;
  const H=pad.t+chartH+nameH+pad.b;
  const effN=fullN>n?fullN:n;
  const targetW=Math.min(460,window.innerWidth-20||440);
  const minSlot=18;
  const fillSlot=Math.max(minSlot,Math.floor((targetW-pad.l-pad.r)/effN));
  const slotW=effN*minSlot+pad.l+pad.r<targetW?fillSlot:minSlot;
  const W=Math.max(effN*slotW+pad.l+pad.r,targetW);
  const BW=slotW*0.45,yBase=pad.t+chartH;
  const maxBar=Math.max(...data.map(p=>+p[barKey]),0.01);
  let dotsVals=[],maxDots=1,minDots=0;
  if(dotsKey){
    dotsVals=data.map(p=>+p[dotsKey]);
    maxDots=Math.max(...dotsVals,0.01);
    minDots=Math.min(...dotsVals);
  }
  let out='';
  out+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#FFFFFF"/>`;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=yBase-t*chartH,v=t*maxBar;
    let lbl;
    if(v===0) lbl='0';
    else if(v>=10000) lbl=(v/1000).toFixed(0)+'k';
    else if(v>=1000) lbl=(v/1000).toFixed(1)+'k';
    else lbl=v>=10?Math.round(v):f(v,1);
    out+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="#EEEEEE" stroke-width="1"/>`;
    out+=`<text x="${pad.l-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="8.5" fill="#CCCCCC">${lbl}</text>`;
  });
  out+=`<text x="${pad.l}" y="14" font-family="Barlow Condensed" font-size="9" fill="#1A7CC2">▪ ${barLabel}</text>`;
  if(dotsKey) out+=`<text x="${pad.l+90}" y="14" font-family="Barlow Condensed" font-size="9" fill="#555">● ${dotsLabel}</text>`;
  const pts=[];
  data.forEach((p,i)=>{
    const cx=pad.l+(i+0.5)*slotW;
    const bh=Math.max((+p[barKey]/maxBar)*chartH,2);
    const by=yBase-bh;
    const clr='#1A7CC2';
    out+=`<rect x="${(cx-BW/2).toFixed(1)}" y="${by.toFixed(1)}" width="${BW.toFixed(1)}" height="${bh.toFixed(1)}" fill="${clr}" opacity="0.88" rx="2"/>`;
    const bv=+p[barKey];
    let bs;
    if(barFormat){ bs=barFormat(bv); }
    else if(barKey==='total_dist'){ bs=Math.round(bv)+''; }
    else { bs=bv>=10?Math.round(bv)+'':Math.round(bv)===bv||Math.abs(bv-Math.round(bv))<0.01?Math.round(bv)+'':f(bv,1); }
    out+=`<text x="${cx.toFixed(1)}" y="${(by-2).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="8" font-weight="700" fill="#333">${bs}</text>`;
    const nameY=yBase+6;
    out+=`<text x="${cx.toFixed(1)}" y="${nameY.toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="10" fill="#444" font-weight="600" transform="rotate(${nameAngle},${cx.toFixed(1)},${nameY.toFixed(1)})">${fmtName(p.name)}</text>`;
    if(dotsKey){
      const range=maxDots-minDots||1;
      const dy=yBase-((+p[dotsKey]-minDots)/range)*chartH*0.80-chartH*0.06;
      pts.push({x:cx,y:dy,val:+p[dotsKey]});
    }
  });
  pts.forEach(p=>{
    out+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2" fill="#555" opacity="0.75"/>`;
    const dv=dotsFormat?dotsFormat(p.val):f(p.val,1);
    const isTop=p.y<pad.t+chartH*0.28;
    const lvy=isTop?p.y+13:p.y-7;
    out+=`<text x="${p.x.toFixed(1)}" y="${lvy.toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="8" fill="#777" opacity="0.9">${dv}</text>`;
  });
  return `<div class="cso"><svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${out}</svg></div>`;
}

function accelChart(data){
  const accKey=accBandMode==='b3'?'accel_b3':'accel_count';
  const decKey=accBandMode==='b3'?'decel_b3':'decel_count';
  const bandLabel=accBandMode==='b3'?'Banda ≥3 m/s²':'Banda ≥2.5 m/s²';
  const toggle=`<div class="chart-toggle">
    <div class="ctab ${accBandMode==='b3'?'active':''}" onclick="accBandMode='b3';render()">Banda ≥3</div>
    <div class="ctab ${accBandMode==='b25'?'active':''}" onclick="accBandMode='b25';render()">Banda ≥2.5</div>
  </div>`;
  const dataWithSum=data.map(p=>({...p,accel_sum:p[accKey]+p[decKey]}));
  const sorted=byGroup(dataWithSum,'accel_sum');
  if(!sorted.length) return toggle+'<p style="color:#ccc;font-family:var(--fbc);text-align:center;padding:14px">Sin datos</p>';
  const n=sorted.length;
  const nameH=46,pad={t:22,r:8,b:6,l:38},chartH=148,H=pad.t+chartH+nameH+pad.b;
  const targetWA=Math.min(460,window.innerWidth-20||440);
  const fillSlotA=Math.max(18,Math.floor((targetWA-pad.l-pad.r)/n));
  const slotW=n*18+pad.l+pad.r<targetWA?fillSlotA:18;
  const W=Math.max(n*slotW+pad.l+pad.r,targetWA);
  const barW=4.5,gap=0.5;
  const maxV=Math.max(...sorted.map(p=>Math.max(p[accKey],p[decKey])),0.01);
  const yBase=pad.t+chartH;
  let out='';
  out+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#FFFFFF"/>`;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=yBase-t*chartH,v=Math.round(t*maxV);
    out+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="#EEEEEE" stroke-width="1"/>`;
    out+=`<text x="${pad.l-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="8.5" fill="#CCCCCC">${v}</text>`;
  });
  out+=`<text x="${pad.l}" y="14" font-family="Barlow Condensed" font-size="9" fill="#1A7CC2">▪ Acelerac. ${bandLabel}</text>`;
  out+=`<text x="${pad.l+140}" y="14" font-family="Barlow Condensed" font-size="9" fill="#E05050">▪ Desacelerac.</text>`;
  sorted.forEach((p,i)=>{
    const cx=pad.l+(i+0.5)*slotW;
    const x0=cx-barW-gap;
    const bha=Math.max((p[accKey]/maxV)*chartH,2);
    const bya=yBase-bha;
    out+=`<rect x="${x0.toFixed(1)}" y="${bya.toFixed(1)}" width="${barW.toFixed(1)}" height="${bha.toFixed(1)}" fill="#1A7CC2" opacity="0.88" rx="2"/>`;
    out+=`<text x="${(x0+barW/2).toFixed(1)}" y="${(bya-2).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="8" fill="#333">${Math.round(p[accKey])}</text>`;
    const x1=cx+gap;
    const bhd=Math.max((p[decKey]/maxV)*chartH,2);
    const byd=yBase-bhd;
    out+=`<rect x="${x1.toFixed(1)}" y="${byd.toFixed(1)}" width="${barW.toFixed(1)}" height="${bhd.toFixed(1)}" fill="#E05050" opacity="0.88" rx="2"/>`;
    out+=`<text x="${(x1+barW/2).toFixed(1)}" y="${(byd-2).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="8" fill="#333">${Math.round(p[decKey])}</text>`;
    out+=`<text x="${cx.toFixed(1)}" y="${(yBase+5).toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="9.5" fill="#444" font-weight="600" transform="rotate(-55,${cx.toFixed(1)},${(yBase+5).toFixed(1)})">${fmtName(p.name)}</text>`;
  });
  return toggle+`<div class="cso"><svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${out}</svg></div>`;
}

function rhieChart(data){
  const sorted=byGroup(data.filter(p=>p.rhie>0),'rhie');
  if(!sorted.length) return '<p style="color:#ccc;font-family:var(--fbc);text-align:center;padding:14px">Sin datos RHIE</p>';
  const n=sorted.length;
  const nameH=46,pad={t:22,r:8,b:6,l:38},chartH=148,H=pad.t+chartH+nameH+pad.b;
  const targetWR=Math.min(460,window.innerWidth-20||440);
  const fillSlotR=Math.max(18,Math.floor((targetWR-pad.l-pad.r)/n));
  const slotW=n*18+pad.l+pad.r<targetWR?fillSlotR:18;
  const W=Math.max(n*slotW+pad.l+pad.r,targetWR);
  const tripleW=slotW*0.72,bW=tripleW/3;
  const maxR=Math.max(...sorted.map(p=>Math.max(p.rhie,p.rhie_max)));
  const yBase=pad.t+chartH;
  let out='';
  out+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#FFFFFF"/>`;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=yBase-t*chartH,v=Math.round(t*maxR);
    out+=`<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="#EEEEEE" stroke-width="1"/>`;
    out+=`<text x="${pad.l-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="8.5" fill="#CCCCCC">${v}</text>`;
  });
  out+=`<text x="${pad.l}" y="14" font-family="Barlow Condensed" font-size="9" fill="#2E7D32">▪ Total</text>`;
  out+=`<text x="${pad.l+44}" y="14" font-family="Barlow Condensed" font-size="9" fill="#1A7CC2">▪ Media</text>`;
  out+=`<text x="${pad.l+88}" y="14" font-family="Barlow Condensed" font-size="9" fill="#C0392B">▪ Máx</text>`;
  sorted.forEach((p,i)=>{
    const cx=pad.l+(i+0.5)*slotW;
    const x0=cx-tripleW/2,x1=x0+bW,x2=x0+bW*2;
    const bh1=Math.max((p.rhie/maxR)*chartH,2);
    const bh2=Math.max((p.rhie_mean/maxR)*chartH,2);
    const bh3=Math.max((p.rhie_max/maxR)*chartH,2);
    out+=`<rect x="${x0.toFixed(1)}" y="${(yBase-bh1).toFixed(1)}" width="${(bW-1).toFixed(1)}" height="${bh1.toFixed(1)}" fill="#2E7D32" opacity="0.88" rx="2"/>`;
    out+=`<text x="${(x0+bW/2).toFixed(1)}" y="${(yBase-bh1-2).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="8" fill="#2E7D32">${p.rhie}</text>`;
    out+=`<rect x="${x1.toFixed(1)}" y="${(yBase-bh2).toFixed(1)}" width="${(bW-1).toFixed(1)}" height="${bh2.toFixed(1)}" fill="#1A7CC2" opacity="0.88" rx="2"/>`;
    out+=`<text x="${(x1+bW/2).toFixed(1)}" y="${(yBase-bh2-2).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="8" fill="#1A7CC2">${Math.round(p.rhie_mean)}</text>`;
    out+=`<rect x="${x2.toFixed(1)}" y="${(yBase-bh3).toFixed(1)}" width="${(bW-1).toFixed(1)}" height="${bh3.toFixed(1)}" fill="#C0392B" opacity="0.75" rx="2"/>`;
    out+=`<text x="${(x2+bW/2).toFixed(1)}" y="${(yBase-bh3-2).toFixed(1)}" text-anchor="middle" font-family="Barlow Condensed" font-size="8" fill="#C0392B">${p.rhie_max}</text>`;
    out+=`<text x="${cx.toFixed(1)}" y="${(yBase+5).toFixed(1)}" text-anchor="end" font-family="Barlow Condensed" font-size="9.5" fill="#444" font-weight="600" transform="rotate(-55,${cx.toFixed(1)},${(yBase+5).toFixed(1)})">${fmtName(p.name)}</text>`;
  });
  return `<div class="cso"><svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">${out}</svg></div>`;
}

function attachDrag(){
  document.querySelectorAll('.cso').forEach(el=>{
    let dn=false,sx,sl;
    el.onmousedown=e=>{dn=true;sx=e.pageX-el.offsetLeft;sl=el.scrollLeft;e.preventDefault()};
    document.onmouseup=()=>dn=false;
    document.onmousemove=e=>{if(!dn)return;el.scrollLeft=sl-(e.pageX-el.offsetLeft-sx)*1.2};
  });
}

function buildCards(data){
  if(!data.length) return '<p style="color:#bbb;text-align:center;padding:30px;font-family:var(--fbc)">Sin datos</p>';
  const sorted=[...data].sort((a,b)=>apellido(a.name).localeCompare(apellido(b.name)));
  if(!selectedPlayer||!sorted.find(p=>p.name===selectedPlayer)) selectedPlayer=sorted[0]?.name||'';
  const sel=`<div class="fut-selector-wrap">
    <label>JUGADOR</label>
    <select onchange="selectFutPlayer(this.value)">
      ${sorted.map(p=>`<option value="${p.name}" ${selectedPlayer===p.name?'selected':''}>${fmtName(p.name)}</option>`).join('')}
    </select>
  </div>`;
  const p=sorted.find(x=>x.name===selectedPlayer)||sorted[0];
  return sel+`<div class="fut-cards-row">${p?buildOneCard(p):''}</div>`;
}
function buildOneCard(p){
  const _parts=p.name.trim().split(' ');
  let firstName,apellidoStr;
  const _last3=_parts.slice(-3).join(' '),_last2=_parts.slice(-2).join(' ');
  if(_parts.length>=4&&DOUBLE_SURNAMES.has(_last3)){ apellidoStr=_last3; firstName=_parts.slice(0,-3).join(' '); }
  else if(_parts.length>=3&&DOUBLE_SURNAMES.has(_last2)){ apellidoStr=_last2; firstName=_parts.slice(0,-2).join(' '); }
  else { apellidoStr=_parts.slice(-1)[0]; firstName=_parts.slice(0,-1).join(' '); }
  if(!apellidoStr) apellidoStr=firstName;
  const distv=p.total_dist>=1000?(p.total_dist/1000).toFixed(2)+'km':Math.round(p.total_dist)+'m';
  const ai18v=p.ai18>=1000?(p.ai18/1000).toFixed(1)+'k':Math.round(p.ai18)+'';
  const r1=[{v:f(p.total_mins,0)+"'",l:'Mins'},{v:f(p.max_vel,2),l:'Vel Máx'},{v:f(p.max_vel_pct,1)+'%',l:'% Vel máx'}];
  const r2=[{v:distv,l:'Dist'},{v:ai18v+'m',l:'HSR'},{v:Math.round(p.dt25)+'m',l:'Sprint'}];
  const r3=[{v:Math.round(p.accel_count)+'',l:'Acel'},{v:Math.round(p.decel_count)+'',l:'Decel'}];
  const r4=[{v:Math.round(p.contacts)+'',l:'Cont.'},{v:f(p.big_avg_time,2)+'s',l:'BiG'}];
  const stat=s=>`<div class="card-stat-item">
    <span class="card-stat-val">${s.v}</span>
    <div class="card-stat-sep"></div>
    <span class="card-stat-lbl">${s.l}</span>
  </div>`;
  return `<div class="fifa-card">
    <div class="card-top">
      <div>
        <div class="card-num-top">${p.gps||'—'}</div>
        <div class="card-pos-lbl">${posLabel(p.position)}</div>
      </div>
      <img class="card-logo-img" src="${LOGO_URL}" alt="CASI">
    </div>
    <div class="card-name-wrap">
      <span class="card-first-name">${firstName}</span>
      <span class="card-last-name">${apellidoStr}</span>
    </div>
    <div class="card-stats-grid-3">${r1.map(stat).join('')}</div>
    <div class="card-stats-grid-3">${r2.map(stat).join('')}</div>
    <div class="card-stats-grid-2">${r3.map(stat).join('')}</div>
    <div class="card-stats-grid-2">${r4.map(stat).join('')}</div>
  </div>`;
}
function selectFutPlayer(name){
  selectedPlayer=name;
  const cs=document.getElementById('cards-section');
  if(cs) cs.innerHTML=buildCards(getDataset());
}

// ─── BOTONERA DINÁMICA ─────────────────────────────────────────────────────
function buildDayTabs(){
  const hasSab=MATCHES.some(m=>m.day==='sab');
  const hasDom=MATCHES.some(m=>m.day==='dom');
  const hasBothDays=hasSab&&hasDom;
  const unifiedEl=document.getElementById('unified-tabs');
  const sabMatches=MATCHES.filter(m=>m.day==='sab');
  const domMatches=MATCHES.filter(m=>m.day==='dom');
  let html=`<div class="ptab active" data-day="total" onclick="setDay('total',this)">TOT</div>`;
  if(hasBothDays) html+=`<div class="ptab" data-day="sab" onclick="setDay('sab',this)">SÁB</div>`;
  if(hasBothDays) html+=`<div class="ptab" data-day="dom" onclick="setDay('dom',this)">DOM</div>`;
  if(hasBothDays&&MATCHES.length) html+=`<div class="ptab" style="color:#ddd;cursor:default;background:transparent;border-color:transparent;padding:3px 2px">|</div>`;
  sabMatches.forEach(m=>{
    html+=`<div class="ptab" data-key="${m.key}" onclick="selectMatchTab('${m.key}',this)">vs ${m.rival}</div>`;
  });
  if(hasBothDays&&domMatches.length){
    html+=`<div class="ptab" style="color:#ddd;cursor:default;background:transparent;border-color:transparent;padding:3px 2px">|</div>`;
  }
  domMatches.forEach(m=>{
    html+=`<div class="ptab" data-key="${m.key}" onclick="selectMatchTab('${m.key}',this)">vs ${m.rival}</div>`;
  });
  unifiedEl.innerHTML=html;
}

function setDay(day,el){
  activeView=day;
  document.querySelectorAll('#unified-tabs .ptab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  updateHeader();
  render();
}
function selectMatchTab(key,el){
  activeView=key;
  document.querySelectorAll('#unified-tabs .ptab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('fecha-opts').style.display='none';
  updateHeader();
  render();
}
function setDayActive(day){
  document.querySelectorAll('#unified-tabs .ptab[data-day]').forEach(b=>{
    b.classList.toggle('active',b.getAttribute('data-day')===day);
  });
  document.querySelectorAll('#unified-tabs .ptab[data-key]').forEach(b=>b.classList.remove('active'));
}
function selectMatch(key){
  activeView=key;
  if(key==='total'||key==='sab'||key==='dom'){
    setDayActive(key);
  } else {
    document.querySelectorAll('#unified-tabs .ptab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('#unified-tabs .ptab[data-key]').forEach(b=>{
      b.classList.toggle('active',b.getAttribute('data-key')===key);
    });
  }
  document.getElementById('fecha-opts').style.display='none';
  updateHeader();
  render();
}
function toggleFechaDD(){
  const opts=document.getElementById('fecha-opts');
  if(opts.style.display==='block'){ opts.style.display='none'; return; }
  const trigger=document.getElementById('hdr-sub');
  const rect=trigger.getBoundingClientRect();
  opts.style.top=(rect.bottom+4)+'px';
  opts.style.left=Math.max(4,rect.left-80)+'px';
  opts.style.display='block';
}
document.addEventListener('click',e=>{
  const opts=document.getElementById('fecha-opts');
  if(opts&&!e.target.closest('#fecha-dd')) opts.style.display='none';
});

function updateHeader(){
  if(activeView==='total'){
    document.getElementById('hdr-sub').textContent='TOTAL ACUMULADO ▾';
    document.getElementById('hdr-score').innerHTML='—';
    document.getElementById('hdr-label').innerHTML='&nbsp;';
  } else if(activeView==='sab'){
    const n=MATCHES.filter(m=>m.day==='sab').length;
    document.getElementById('hdr-sub').textContent=`SÁBADO · ${n} PARTIDO${n!==1?'S':''} ▾`;
    document.getElementById('hdr-score').innerHTML='—';
    document.getElementById('hdr-label').innerHTML='&nbsp;';
  } else if(activeView==='dom'){
    const n=MATCHES.filter(m=>m.day==='dom').length;
    document.getElementById('hdr-sub').textContent=`DOMINGO · ${n} PARTIDO${n!==1?'S':''} ▾`;
    document.getElementById('hdr-score').innerHTML='—';
    document.getElementById('hdr-label').innerHTML='&nbsp;';
  } else {
    const match=MATCHES.find(m=>m.key===activeView);
    if(match){
      const dayLabel=match.day==='sab'?'SÁB':'DOM';
      document.getElementById('hdr-sub').textContent=`${dayLabel} · ${match.rival} ▾`;
      const casi=match.casiScore,rival=match.rivalScore;
      document.getElementById('hdr-score').innerHTML=`${casi}<span class="sep">–</span>${rival}`;
      const won=parseInt(casi)>parseInt(rival);
      const tied=casi===rival;
      const lbl=tied?'EMPATE':won?'VICTORIA':'DERROTA';
      document.getElementById('hdr-label').innerHTML=`<b class="${won?'win':'loss'}">${lbl}</b>`;
    }
  }
  document.querySelectorAll('#fecha-opts [data-key]').forEach(d=>{
    d.classList.toggle('active',d.getAttribute('data-key')===activeView);
  });
}

function buildDropdown(){
  const opts=document.getElementById('fecha-opts');
  const sabMatches=MATCHES.filter(m=>m.day==='sab');
  const domMatches=MATCHES.filter(m=>m.day==='dom');
  let html='';
  html+=`<div class="opts-sep">ACUMULADO</div>`;
  html+=`<div data-key="total" onclick="selectMatch('total')">📊 Total acumulado</div>`;
  if(sabMatches.length) html+=`<div data-key="sab" onclick="selectMatch('sab')">🌅 Sábado (${sabMatches.length} partido${sabMatches.length!==1?'s':''})</div>`;
  if(domMatches.length) html+=`<div data-key="dom" onclick="selectMatch('dom')">☀️ Domingo (${domMatches.length} partido${domMatches.length!==1?'s':''})</div>`;
  if(MATCHES.length) html+=`<div class="opts-sep">PARTIDOS</div>`;
  MATCHES.forEach(m=>{
    const dayLabel=m.day==='sab'?'SÁB':'DOM';
    html+=`<div data-key="${m.key}" onclick="selectMatch('${m.key}')">${dayLabel} · ${m.rival} &nbsp;<span style="color:#aaa;font-size:10px">${m.casiScore}–${m.rivalScore}</span></div>`;
  });
  opts.innerHTML=html;
}

// ─── RENDER ────────────────────────────────────────────────────────────────
function render(){
  const data=getDataset();
  if(!data.length){
    document.getElementById('mc').innerHTML='<p style="color:#bbb;text-align:center;padding:30px;font-family:var(--fbc)">Sin datos</p>';
    return;
  }
  let h='';

  h+=`<div class="sec">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:9px">
      <span style="font-family:var(--fbc);font-size:11px;font-weight:700;color:#bbb;letter-spacing:1.8px;text-transform:uppercase">RESUMEN</span>
      <div style="flex:1;height:1px;background:var(--bord)"></div>
      <div style="display:flex;gap:4px">
        <div class="ptab ${viewMode==='stats'?'active':''}" onclick="setView('stats')">Equipo</div>
        <div class="ptab ${viewMode==='cards'?'active':''}" onclick="setView('cards')">Individual</div>
      </div>
    </div>
    ${viewMode==='stats'?buildKPIs(data):''}
  </div>`;

  if(viewMode==='cards'){
    document.getElementById('mc').innerHTML=h+'<div id="cards-section">'+buildCards(data)+'</div>';
    attachDrag();
    return;
  }

  const cargaHtml=buildSemaforoCarga(data);
  if(cargaHtml) h+=`<div class="sec"><div class="sec-ttl">🚦 SEMÁFORO DE CARGA</div>${cargaHtml}</div>`;



  h+=`<div class="sec"><div class="sec-ttl">🏃 VELOCIDAD MÁX · TOP 3</div><div class="podium">${velPodium(data)}</div></div>`;
  h+=`<div class="sec"><div class="sec-ttl">⏱ MINUTOS JUGADOS</div>${minChart(data)}</div>`;
  h+=`<div class="sec"><div class="sec-ttl">🏃 VELOCIDAD MÁXIMA</div>${velChart(data)}</div>`;
  h+=`<div class="sec"><div class="sec-ttl">📏 DISTANCIA</div>${distChart(data)}</div>`;
  h+=`<div class="sec"><div class="sec-ttl">🔥 ALTA INTENSIDAD HSR</div>${hsrChart(data)}</div>`;
  h+=`<div class="sec"><div class="sec-ttl">💨 SPRINT</div>${sprintChart(data)}</div>`;
  h+=`<div class="sec"><div class="sec-ttl">⚡ ACELERACIONES / DESACELERACIONES</div>${accelChart(data)}</div>`;
  h+=`<div class="sec"><div class="sec-ttl">📊 RHIE</div>${rhieChart(data)}</div>`;
  h+=`<div class="sec"><div class="sec-ttl">💥 CONTACTOS</div>${contactChart(data)}</div>`;
  h+=`<div class="sec"><div class="sec-ttl">🔁 VUELTA AL JUEGO (BiG)</div>${bigChart(data)}</div>`;

  document.getElementById('mc').innerHTML=h;
  attachDrag();
}

// ─── INICIALIZACIÓN ────────────────────────────────────────────────────────
(async function(){
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px';
  overlay.innerHTML='<div style="font-family:Barlow Condensed,sans-serif;font-size:15px;color:var(--cel);font-weight:700">Cargando datos Seven...</div><div style="width:36px;height:36px;border:3px solid var(--bord);border-top-color:var(--cel);border-radius:50%;animation:spin 0.8s linear infinite"></div>';
  document.body.appendChild(overlay);
  const style=document.createElement('style');
  style.textContent='@keyframes spin{to{transform:rotate(360deg)}}';
  document.head.appendChild(style);

  try{
    // ─── LISTA DE PARTIDOS ──────────────────────────────────────────────────
    // Cuando subás un CSV nuevo a la carpeta seven-2026 del repo,
    // agregá su nombre acá. Formato: 'dia-Rival-scoreCASI-scoreRival.csv'
    // Ejemplos:
    //   'sab-Newman-28-14.csv'
    //   'dom-Alumni-7-21.csv'
    const CSV_FILES = [
      'sab-Belgrano-14-10.csv',
    ];
    // ───────────────────────────────────────────────────────────────────────

    if(!CSV_FILES.length) throw new Error('No hay partidos cargados todavía.\nAgregá los nombres de los CSV en la lista CSV_FILES del HTML.');

    const promises=CSV_FILES.map(async filename=>{
      const meta=parseMatchKey(filename);
      const rawUrl=`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/${FOLDER}/${encodeURIComponent(filename)}`;
      const resp=await fetch(rawUrl);
      if(!resp.ok) return null;
      const text=await resp.text();
      const data=parseCSV(text);
      return {
        key: filename.replace('.csv',''),
        filename: filename,
        day: meta.day,
        rival: meta.rival,
        casiScore: meta.casiScore,
        rivalScore: meta.rivalScore,
        data,
      };
    });
    const results=await Promise.all(promises);
    MATCHES=results.filter(r=>r&&r.data.length>0);

    if(!MATCHES.length) throw new Error('No se pudieron cargar datos de los partidos');

    MATCHES.sort((a,b)=>{
      if(a.day!==b.day) return a.day==='sab'?-1:1;
      return a.rival.localeCompare(b.rival);
    });

    buildDropdown();
    buildDayTabs();

    activeView='total';
    updateHeader();

    overlay.remove();
    render();
  } catch(e){
    overlay.innerHTML=`<div style="padding:40px;text-align:center;font-family:Barlow Condensed,sans-serif;color:#e44;font-size:14px;">
      Error cargando datos.<br><span style="font-size:11px;color:#aaa">${e.message}</span><br><br>
      <span style="font-size:11px;color:#aaa">Verificá tu conexión e intentá de nuevo.</span>
    </div>`;
    console.error(e);
  }
})();

// ─── INSTALL PWA ────────────────────────────────────────────────────────────
let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('install-btn').classList.add('show');
});
document.getElementById('install-btn').addEventListener('click',()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(()=>{ deferredPrompt=null; document.getElementById('install-btn').classList.remove('show'); });
});
window.addEventListener('appinstalled',()=>document.getElementById('install-btn').classList.remove('show'));
var isIos=/iphone|ipad|ipod/i.test(navigator.userAgent),isStandalone=window.navigator.standalone;
if(isIos&&!isStandalone){ setTimeout(()=>document.getElementById('ios-banner').classList.add('show'),2000); }
document.getElementById('ios-banner-close').addEventListener('click',()=>document.getElementById('ios-banner').classList.remove('show'));
</script>
</body>
